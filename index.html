const { useState, useEffect, useRef } = React;

const GS_URL = "https://script.google.com/macros/s/AKfycbxxVRHIN6wJzC56mjt-B1Cipji0xg0Wq0CH2F2kd4UivvOLjs49gxmJ4WrBTuc7XC64/exec";
const gs = {
  get: async function(s) { try { return await (await fetch(GS_URL+"?sheet="+encodeURIComponent(s))).json(); } catch(e) { return []; } },
  upsert: async function(s,d) { try { await fetch(GS_URL+"?action=upsert&sheet="+encodeURIComponent(s)+"&data="+encodeURIComponent(JSON.stringify(d))); } catch(e) {} },
  del: async function(s,id) { try { await fetch(GS_URL+"?action=delete&sheet="+encodeURIComponent(s)+"&data="+encodeURIComponent(JSON.stringify({id:id}))); } catch(e) {} },
  translate: async function(fields) {
    var entries = Object.entries(fields).filter(function(e){return e[1]&&typeof e[1]==="string"&&e[1].trim();});
    if(!entries.length) return fields;
    try {
      var r = await fetch(GS_URL+"?action=translate&data="+encodeURIComponent(JSON.stringify(Object.fromEntries(entries))));
      var j = await r.json();
      return Object.assign({},fields,j);
    } catch(e) { return fields; }
  },
  jira: async function(epics) { try { return await (await fetch(GS_URL+"?action=jira&data="+encodeURIComponent(JSON.stringify(epics)))).json(); } catch(e) { return {ok:false,error:String(e)}; } },
  generateEpics: async function(requirements, additionalContext) {
    var res = await fetch(GS_URL+"?action=generate_epics&data="+encodeURIComponent(JSON.stringify({requirements:requirements,additionalContext:additionalContext})));
    return await res.json();
  },
};

async function loadVoting() {
  var rows = await gs.get("scores_upvotes");
  var votes = {}, closed = false;
  rows.forEach(function(r) {
    if(r.id==="__voting_closed__"){closed=!!r.scores;return;}
    if(r.upvotes&&Object.keys(r.upvotes).length) votes[r.id]=r.upvotes;
  });
  return {votes:votes,closed:closed};
}

  var FIELD_TOOLTIPS = {

  roleplay:{title:"Roleplay Evidence / Additional Context",what:"A concrete blow-by-blow of what happened — who did what, in what order, and what was the consequence.",why:"This is the evidence that makes the requirement real and defensible.",tips:["Name the roles involved","Include the exact sequence of events","End with the consequence and time cost"],bad:"There was confusion about the format",good:"PM sent Slack asking about aspect ratio. No response for 20 min. Editor assumed 9:16, finished cut. Client replied asking for 16:9 — 45 min rework."},
  frequency:{title:"How Often Does This Happen?",what:"Your honest estimate of how often this comes up in real production.",why:"Frequency is one of the biggest drivers of prioritization — a small pain that happens every project outweighs a big pain that happens once a year.",tips:["Always = virtually every project","Often = more than half of projects","Sometimes = occasional edge cases","Rare but critical = low frequency, very high severity when it hits"]},
  pipelineStage:{title:"Pipeline Stage",what:"The stage where this problem first surfaces in the production pipeline.",why:"Helps the team cluster requirements by theme and identify which parts of the workflow need the most attention.",tips:["Pick the stage where the problem first surfaces","If it spans multiple stages, choose Cross-stage"]},
  stakeholders:{title:"Who Feels the Pain?",what:"Every role that is negatively affected when this problem occurs.",why:"Problems that impact multiple stakeholders are more urgent — they represent compounded cost across the team.",      tips:["Customer = brand / client side","Creative = strategy and scripting","Editors = producing and cutting ads","Footage production = footage production team","PMs = coordinating and tracking","Engineering = building and maintaining"]},
  consequences:{title:"What Does It Actually Cost?",what:"The real downstream impact of leaving this problem unsolved.",why:"This separates 'annoying' from 'existentially dangerous' — it forces the team to be honest about the real cost of inaction.",tips:["Time loss = wasted hours per project","Quality degradation = errors or rework reaching the client","Scale limitation = blocks the team from growing","Client churn risk = may cause a client to leave","Internal burn = team frustration and morale damage"]},
  workaround:{title:"Current Workaround",what:"What the team does today to compensate for this problem not being solved.",why:"Every workaround is proof the problem is real. It also shows the hidden cost already being paid.",tips:["Be specific about the steps involved","Estimate the time cost per occurrence","If there is no workaround, say so — that makes it more urgent"],bad:"We handle it manually",good:"Editor sends a Slack to PM, waits, sometimes guesses. Roughly 20–45 min lost per project."},
  agentPotential:{title:"Agent Potential",what:"The level of AI automation that would make sense if this problem were solved.",why:"Helps Engineering think about whether the solution should be a UI fix, an AI-assisted feature, or a fully autonomous agent step.",tips:["Assisted = human decides, AI drafts or suggests","Fully automated = AI handles it end-to-end every time","Orchestrated = an agent coordinates multiple steps or tools","Not suitable = requires human judgment, client relationship, or creative intuition"]},

};

function teamColor(n){return TEAM_COLORS[TEAMS.indexOf(n)%TEAM_COLORS.length]||TEAM_COLORS[0];}

function buckBadge(b){return ({"Must-fix":"bg-rose-100 text-rose-700","Scale enabler":"bg-amber-100 text-amber-700","Strategic bet":"bg-indigo-100 text-indigo-700"})[b]||"bg-gray-100 text-gray-600";}
function getScore(r){return (r.impactScore||0)+(r.frequencyScore||0)+(r.riskScore||0)+(r.leverageScore||0);}

function voterId(user){return (user.name||user.team).toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");}
function top5ByTeam(reqs,team){return reqs.filter(function(r){return r.team===team;}).sort(function(a,b){return getScore(b)-getScore(a);}).slice(0,5);}

}

function Tooltip(props){
  var tip=props.tip;
  var _s=useState(false); var open=_s[0]; var setOpen=_s[1];
  var ref=useRef(null);
  useEffect(function(){
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener("mousedown",h);return function(){document.removeEventListener("mousedown",h);};
  },[]);
  return <div className="relative inline-block" ref={ref}>
    <button onClick={function(){setOpen(function(o){return !o;});}} className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-500 text-xs font-black hover:bg-indigo-200 flex items-center justify-center">?</button>
    {open&&<div className="absolute z-50 left-0 top-7 w-80 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 space-y-3">
      <p className="text-sm font-black text-gray-900">{tip.title}</p>
      <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">What</p><p className="text-xs text-gray-600 leading-relaxed">{tip.what}</p></div>
      <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Why it matters</p><p className="text-xs text-gray-600 leading-relaxed">{tip.why}</p></div>
      {tip.tips&&<div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Tips</p><ul className="space-y-1">{tip.tips.map(function(t,i){return <li key={i} className="text-xs text-gray-600 flex gap-1.5"><span className="text-indigo-400">→</span>{t}</li>;})}</ul></div>}

      </div>}
    </div>}
  </div>;
}

function EntryScreen(props){

// ── Submit Tab ───────────────────────────────────────────────
function SubmitTab(props){

  var missing=[!form.problem.trim()&&"problem",!form.roleplayExample.trim()&&"context",!form.frequency&&"frequency",!form.definition.trim()&&"definition of solved"].filter(Boolean);

      <Field label="How often does this happen in real production?" required={true} tipKey="frequency">

  </div>;

function EngineeringTab(props){

  var _si=useState([]); var selectedIds=_si[0]; var setSelected=_si[1];
  var _rc=useState({}); var reqContexts=_rc[0]; var setReqContexts=_rc[1];
  var _er=useState(null); var expandedReq=_er[0]; var setExpandedReq=_er[1];
  var _ep=useState([]); var epics=_ep[0]; var setEpics=_ep[1];
  var _gen=useState(false); var generating=_gen[0]; var setGenerating=_gen[1];
  var _ge=useState(""); var genError=_ge[0]; var setGenError=_ge[1];
  var _ji=useState(""); var jsonInput=_ji[0]; var setJsonInput=_ji[1];
  var _je=useState(""); var jsonError=_je[0]; var setJsonError=_je[1];
  var _pr=useState([]); var pushedReqIds=_pr[0]; var setPushedReqIds=_pr[1];
  var _pres=useState(null); var pushResult=_pres[0]; var setPushResult=_pres[1];

  function getTotalVotes(id){var t=0;Object.values(votes).forEach(function(v){t+=(Number(v[String(id)])||0);});return t;}
  function getScore2(r){return getScore(r)+getTotalVotes(r.id);}
  var top10=reqs.slice().sort(function(a,b){return getScore2(b)-getScore2(a);}).slice(0,10);
  var selectedReqs=top10.filter(function(r){return selectedIds.includes(r.id);});

      var parsed=JSON.parse(jsonInput.trim().replace(/```json|```/g,"").trim());
      if(!Array.isArray(parsed))throw new Error("Expected a JSON array");
      setEpics(parsed.map(function(e,i){return Object.assign({},e,{id:Date.now()+i,approved:false,reqIds:(e.reqIds||[]).map(function(id){return String(id);})});}));
      setStep("review");
    }catch(err){setJsonError("Invalid JSON: "+err.message);}
  }
  function updateEpic(idx,patch){setEpics(function(p){return p.map(function(e,i){return i===idx?Object.assign({},e,patch):e;});});}
  function updateTicket(eIdx,tIdx,patch){setEpics(function(p){return p.map(function(e,i){return i===eIdx?Object.assign({},e,{tickets:e.tickets.map(function(t,j){return j===tIdx?Object.assign({},t,patch):t;})}):e;});});}
  function removeTicket(eIdx,tIdx){setEpics(function(p){return p.map(function(e,i){return i===eIdx?Object.assign({},e,{tickets:e.tickets.filter(function(_,j){return j!==tIdx;})}):e;});});}
  var approvedEpics=epics.filter(function(e){return e.approved;});

  }

  if(step==="done")return <div className="space-y-4">

  </div>;

  if(step==="pushing")return <div className="flex flex-col items-center justify-center py-32 gap-4 text-gray-400"><div className="text-6xl animate-bounce">🚀</div><p className="text-sm font-bold text-gray-600">Pushing to Jira…</p></div>;

      <textarea className={"w-full border-2 rounded-xl px-4 py-3 text-xs font-mono focus:outline-none resize-none h-48 "+(jsonError?"border-rose-400":"border-gray-200 focus:border-indigo-400")} placeholder={'[\n  { "title": "...", ... }\n]'} value={jsonInput} onChange={function(e){setJsonInput(e.target.value);setJsonError("");}}/>
      {jsonError&&<p className="text-xs text-rose-600">{jsonError}</p>}
      <button onClick={parseJson} disabled={!jsonInput.trim()} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">Review Epics →</button>
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>;

  if(step==="review")return <div className="flex gap-4 items-start">
    <div className="flex-1 min-w-0 space-y-4">
      <div className="bg-white rounded-xl border p-4 flex items-center justify-between"><div><p className="text-sm font-bold text-gray-800">Review & Approve Epics</p><p className="text-xs text-gray-400">Edit, approve, then push to Jira.</p></div><button onClick={function(){setStep("select");}} className="text-xs text-gray-400 hover:text-gray-600">← Back</button></div>
      {epics.map(function(epic,eIdx){
        var epicReqs=selectedReqs.filter(function(r){return (epic.reqIds||[]).includes(String(r.id));});
        return <div key={eIdx} className={"bg-white rounded-2xl border-2 shadow-sm overflow-hidden "+(epic.approved?"border-emerald-400":"border-gray-200")}>
          <div className={"px-4 py-3 flex items-center justify-between gap-3 "+(epic.approved?"bg-emerald-50":"bg-gray-50")}>
            <div className="flex items-center gap-2 flex-wrap"><span className="text-xs font-black text-gray-400">EPIC {eIdx+1}</span>{epic.bucket&&<span className={"text-xs px-2 py-0.5 rounded-full font-medium "+buckBadge(epic.bucket)}>{epic.bucket}</span>}<span className="text-xs text-gray-400">{epicReqs.length} reqs · {(epic.tickets&&epic.tickets.length)||0} tickets</span></div>
            <button onClick={function(){updateEpic(eIdx,{approved:!epic.approved});}} className={"flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border-2 transition-all "+(epic.approved?"bg-emerald-500 border-emerald-500 text-white":"border-gray-300 text-gray-500 hover:border-emerald-400")}>{epic.approved?"✓ Approved":"Approve"}</button>
          </div>
          <div className="p-4 space-y-3">
            <div><label className="text-xs font-bold text-gray-500 block mb-1">Title</label><input className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:border-indigo-400" value={epic.title||""} onChange={function(e){updateEpic(eIdx,{title:e.target.value});}}/></div>
            <div><label className="text-xs font-bold text-gray-500 block mb-1">Description</label><textarea className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none" rows={2} value={epic.description||""} onChange={function(e){updateEpic(eIdx,{description:e.target.value});}}/></div>
            {epic.openQuestions&&epic.openQuestions.length>0&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-1"><p className="text-xs font-bold text-amber-700">❓ Open questions</p>{epic.openQuestions.map(function(q,qi){return <p key={qi} className="text-xs text-amber-800 flex gap-1.5"><span>·</span>{q}</p>;})}</div>}
            {epicReqs.length>0&&<div className="space-y-1"><p className="text-xs font-bold text-gray-400">Linked requirements</p>{epicReqs.map(function(r){return <div key={r.id} className="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-1.5"><span className="w-2 h-2 rounded-full bg-indigo-400 flex-shrink-0 mt-1"/>{r.problem}</div>;})}</div>}
            {epic.tickets&&epic.tickets.length>0&&<div className="space-y-2 pt-1 border-t"><p className="text-xs font-bold text-gray-400 pt-1">Child tickets</p>
              {epic.tickets.map(function(t,tIdx){return <div key={tIdx} className="bg-slate-50 border border-gray-200 rounded-xl p-3 space-y-2">
                <div className="flex gap-2 items-center"><span className="text-xs font-black text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded flex-shrink-0">T{tIdx+1}</span><input className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400 bg-white" value={t.title||""} onChange={function(e){updateTicket(eIdx,tIdx,{title:e.target.value});}}/><button onClick={function(){removeTicket(eIdx,tIdx);}} className="text-gray-300 hover:text-red-400 text-lg flex-shrink-0">×</button></div>
                {t.role&&t.goal&&<p className="text-xs text-gray-500 px-1">As a <strong>{t.role}</strong>, I want to {t.goal}{t.benefit?" "+t.benefit:""}</p>}
                {t.questions&&t.questions.length>0&&<div className="bg-yellow-50 rounded-lg px-2 py-1.5">{t.questions.map(function(q,qi){return <p key={qi} className="text-xs text-yellow-700 flex gap-1"><span>❓</span>{q}</p>;})}</div>}
                <div className="space-y-1">{(t.acs||[]).map(function(ac,ai){return <div key={ai} className="flex gap-2 items-start"><span className="text-xs text-gray-300 mt-1.5 flex-shrink-0">AC{ai+1}</span><input className="flex-1 border border-gray-100 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-indigo-300 bg-white" value={ac||""} onChange={function(e){var acs=[...t.acs];acs[ai]=e.target.value;updateTicket(eIdx,tIdx,{acs:acs});}}/></div>;})}</div>
              </div>;})}
            </div>}
          </div>
        </div>;
      })}
      <div className="sticky bottom-4 pt-2">
        <button onClick={pushToJira} disabled={!approvedEpics.length} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl">🚀 Push {approvedEpics.length} epic{approvedEpics.length!==1?"s":""} to Jira</button>
        {!approvedEpics.length&&<p className="text-center text-xs text-gray-400 mt-2">Approve at least one epic to continue</p>}
      </div>
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>;

  // Select step
  return <div className="flex gap-4 items-start">
    <div className="flex-1 min-w-0 space-y-4">
      <div className="bg-white rounded-xl border p-4 space-y-1"><p className="text-sm font-bold text-gray-800">⚙️ Engineering — Top 10 requirements</p><p className="text-xs text-gray-500">Ranked by votes + self-score. Select and add context per requirement.</p></div>
      {top10.length===0
        ?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No voted requirements yet.</p></div>
        :<div className="space-y-3">
          <div className="bg-white rounded-xl border p-3 flex items-center justify-between">
            <button onClick={toggleAll} className="text-xs font-bold text-indigo-600 hover:underline">{selectedIds.length===top10.length?"Deselect all":"Select all"}</button>
            <span className="text-xs text-gray-400">{selectedIds.length} of {top10.length} selected</span>
          </div>
          {top10.map(function(r,idx){
            var tc=teamColor(r.team); var sel=selectedIds.includes(r.id); var score=getScore(r); var v2=getTotalVotes(r.id);
            var isExpanded=expandedReq===r.id; var isPushed=pushedReqIds.includes(String(r.id));
            var bucket=autoBucket(score);
            return <div key={r.id} className={"bg-white rounded-xl border shadow-sm overflow-hidden"+(sel?" border-indigo-200":"")+(isPushed?" border-l-4 border-l-emerald-400":"")}>
              <div onClick={function(){toggleReq(r.id);}} className={"flex items-start gap-3 px-4 py-3 cursor-pointer transition-all "+(sel?"bg-indigo-50":"hover:bg-gray-50")}>
                <div className={"mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 "+(sel?"bg-indigo-600 border-indigo-600":"border-gray-300")}>{sel&&<span className="text-white text-xs">✓</span>}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2"><span className="text-xs font-black text-gray-400">#{idx+1}</span><p className={"text-sm font-semibold "+(sel?"text-indigo-800":"text-gray-800")}>{r.problem}</p></div>
                  <div className="flex flex-wrap gap-1.5 mt-1">
                    <Badge cls={tc.badge}>{r.team}</Badge>
                    <span className={"text-xs px-2 py-0.5 rounded-full font-medium "+buckBadge(bucket)}>{bucket}</span>
                    {score>0&&<span className="text-xs text-indigo-500 font-bold">⭐{score}</span>}
                    {v2>0&&<span className="text-xs text-emerald-600 font-bold">🗳️{v2}</span>}
                    {isPushed&&<Badge cls="bg-emerald-100 text-emerald-700">✅ In Jira</Badge>}
                  </div>
                  {r.definition&&<p className="text-xs text-emerald-600 mt-1 italic">🎯 {r.definition.slice(0,80)}{r.definition.length>80?"…":""}</p>}
                </div>
                <button onClick={function(e){e.stopPropagation();setExpandedReq(isExpanded?null:r.id);}} className="text-gray-300 hover:text-gray-500 text-lg flex-shrink-0">{isExpanded?"▲":"▼"}</button>
              </div>
              {isExpanded&&<div className="border-t bg-slate-50 p-4 space-y-3">
                {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
                {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
                <div>
                  <label className="text-xs font-bold text-gray-600 block mb-1">💬 Additional context <span className="text-gray-400 font-normal">(optional — translates to English)</span></label>
                  <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-400 resize-none bg-white" rows={3} placeholder="e.g. Blocked by Auth Service refactor in Q2. Prioritize after that ships." value={reqContexts[r.id]||""} onChange={function(e){setCtx(r.id,e.target.value);}}/>
                </div>
              </div>}
            </div>;
          })}
          <div className="sticky bottom-4 pt-2 space-y-2">
            {genError&&<div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3 text-xs text-rose-600 text-center">{genError} — <button onClick={function(){setStep("paste");}} className="underline font-bold">paste manually instead</button></div>}
            <button onClick={doGenerate} disabled={!selectedIds.length||generating} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl transition-all">
              {generating?<span className="flex items-center justify-center gap-2"><span className="animate-spin inline-block">⚙️</span>Generating epics & tickets… (~20s)</span>:("✨ Generate epics & tickets from "+selectedIds.length+" requirement"+(selectedIds.length!==1?"s":""))}
            </button>
            {selectedIds.length>0&&!generating&&<p className="text-center text-xs text-gray-400">Powered by Claude via Apps Script</p>}
          </div>
        </div>
      }
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>;
}

// ── Main App ─────────────────────────────────────────────────
function App(){
  var _u=useState(null); var user=_u[0]; var setUser=_u[1];
  var _dy=useState(1); var day=_dy[0]; var setDay=_dy[1];
  var _tb=useState(0); var tab=_tb[0]; var setTab=_tb[1];
  var _rq=useState([]); var reqs=_rq[0]; var setReqs=_rq[1];
  var _vt=useState({}); var votes=_vt[0]; var setVotes=_vt[1];
  var _vc=useState(false); var votingClosed=_vc[0]; var setVotingClosed=_vc[1];
  var _ld=useState(true); var loading=_ld[0]; var setLoading=_ld[1];
  var _sy=useState("idle"); var syncStatus=_sy[0]; var setSync=_sy[1];
  var _lr=useState(null); var lastRefresh=_lr[0]; var setRefresh=_lr[1];

  async function loadAll(){
    var results=await Promise.all([gs.get("requirements"),loadVoting()]);
    setReqs(results[0]);setVotes(results[1].votes);setVotingClosed(results[1].closed);setRefresh(new Date());
  }
  useEffect(function(){loadAll().finally(function(){setLoading(false);});},[]);
  useEffect(function(){
    if(!user)return;
    var iv=setInterval(loadAll,30000);
    return function(){clearInterval(iv);};
  },[user]);

  async function withSync(fn){setSync("syncing");try{await fn();setSync("ok");setTimeout(function(){setSync("idle");},2500);}catch(e){setSync("error");setTimeout(function(){setSync("idle");},4000);}}
  async function addReq(req){setSync("syncing");try{await gs.upsert("requirements",req);await loadAll();setSync("ok");setTimeout(function(){setSync("idle");},2500);}catch(e){setSync("error");setTimeout(function(){setSync("idle");},4000);}}
  async function updateReq(id,patch){var updated=reqs.map(function(r){return r.id===id?Object.assign({},r,patch):r;});setReqs(updated);await withSync(function(){return gs.upsert("requirements",updated.find(function(r){return r.id===id;}));});}
  async function deleteReq(id){setReqs(function(p){return p.filter(function(r){return r.id!==id;});});await withSync(function(){return gs.del("requirements",id);});}

  async function castVote(reqId,pts){
    var vid=voterId(user); var sid=String(reqId);
    setVotes(function(prev){var myV=Object.assign({},prev[vid]||{});if(pts===0){delete myV[sid];}else{myV[sid]=pts;}var next=Object.assign({},prev);next[vid]=myV;gs.upsert("scores_upvotes",{id:vid,scores:{},upvotes:myV});return next;});
  }
  async function closeVoting(){setVotingClosed(true);await gs.upsert("scores_upvotes",{id:"__voting_closed__",scores:true,upvotes:{}});}
  async function resetVoting(){
    if(!window.confirm("Reset all votes? This cannot be undone."))return;
    setVotes({});setVotingClosed(false);
    await gs.del("scores_upvotes","__voting_closed__");
    var allPeople=Object.values(TEAM_MEMBERS).flat();
    for(var i=0;i<allPeople.length;i++){
      var vid=allPeople[i].toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
      await gs.upsert("scores_upvotes",{id:vid,scores:{},upvotes:{}});
    }
  }

  if(loading)return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#9ca3af",gap:"12px"}}><div style={{fontSize:"2.5rem"}}>⚡</div><p style={{fontSize:"0.875rem"}}>Loading from Google Sheets…</p></div>;
  if(!user)return <EntryScreen onEnter={function(t,d,name){setUser({team:t,name:name});setDay(d);setTab(0);}}/>;

  var tc=teamColor(user.team); var tabs=day===1?TABS_D1:TABS_D2;
  return <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50">
    <div className="bg-indigo-700 text-white px-6 py-4 flex items-center justify-between shadow-lg">
      <div><h1 className="text-xl font-bold">⚡ Offsite Hub</h1>
        <div className="flex items-center gap-2 mt-0.5"><span className={"text-xs px-2 py-0.5 rounded-full font-bold "+(day===1?"bg-amber-400 text-amber-900":"bg-emerald-400 text-emerald-900")}>Day {day}</span><p className="text-indigo-300 text-xs">{day===1?"Roleplay + Capture":"Synthesis + Engineering"}</p></div>
      </div>
      <div className="text-right">
        <span className={"inline-flex items-center px-3 py-1 rounded-full text-xs font-bold "+tc.bg+" text-white"}>{user.name||user.team}</span>
        <p className="text-indigo-300 text-xs mt-0.5 opacity-70">{user.team}</p>
        <p className="text-indigo-300 text-xs cursor-pointer hover:text-white" onClick={function(){setUser(null);}}>Switch →</p>
      </div>
    </div>
    <div className="bg-white border-b px-6 py-2.5 flex gap-4 text-xs text-gray-500 flex-wrap items-center">
      <span>📌 <strong className="text-gray-800">{reqs.length}</strong> requirements</span>
      <span>🏷️ <strong className="text-gray-800">{[...new Set(reqs.map(function(r){return r.team;}))].length}</strong> teams</span>
      {votingClosed&&<span className="text-rose-600 font-bold">🏁 Voting closed</span>}
      <span className="flex items-center gap-1.5"><SyncBadge status={syncStatus}/>{syncStatus==="idle"&&lastRefresh&&<span className="text-gray-300">Synced {lastRefresh.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>}</span>
      <button onClick={function(){setDay(function(d){return d===1?2:1;});}} className="ml-auto text-indigo-500 hover:underline">Switch to Day {day===1?2:1} →</button>
    </div>
    <div className="flex border-b bg-white px-4 overflow-x-auto">
      {tabs.map(function(t,i){return <button key={i} onClick={function(){setTab(i);}} className={"px-4 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition-colors "+(tab===i?"border-indigo-600 text-indigo-700":"border-transparent text-gray-500 hover:text-gray-700")}>{t}</button>;})}
    </div>
    <div className={(day===2&&tab===2?"px-5 py-5":"max-w-3xl mx-auto p-5")+" space-y-4"}>
      {day===1&&<TeamContextPanel team={user.team}/>}
      {day===1&&tab===0&&<SubmitTab user={user} onSave={addReq} syncStatus={syncStatus}/>}
      {day===1&&tab===1&&<RequirementsTab reqs={reqs} user={user} onUpdate={updateReq} onDelete={deleteReq} syncStatus={syncStatus}/>}
      {day===2&&tab===0&&<ReadOutTab reqs={reqs} onUpdate={updateReq}/>}
      {day===2&&tab===1&&<SynthesisVoteTab reqs={reqs} votes={votes} votingClosed={votingClosed} user={user} onVote={castVote} onCloseVoting={closeVoting} onResetVoting={resetVoting} onUpdateReq={updateReq}/>}
      {day===2&&tab===2&&<EngineeringTab reqs={reqs} votes={votes} votingClosed={votingClosed}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
