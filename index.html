<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const GS_URL = "https://script.google.com/macros/s/AKfycbxxVRHIN6wJzC56mjt-B1Cipji0xg0Wq0CH2F2kd4UivvOLjs49gxmJ4WrBTuc7XC64/exec";
const gs = {
  get: async (s) => { try { return await (await fetch(`${GS_URL}?sheet=${encodeURIComponent(s)}`)).json(); } catch { return []; } },
  upsert: async (s, d) => { try { await fetch(`${GS_URL}?action=upsert&sheet=${encodeURIComponent(s)}&data=${encodeURIComponent(JSON.stringify(d))}`); } catch {} },
  del: async (s, id) => { try { await fetch(`${GS_URL}?action=delete&sheet=${encodeURIComponent(s)}&data=${encodeURIComponent(JSON.stringify({id}))}`); } catch {} },
  translate: async (fields) => {
    const entries = Object.entries(fields).filter(([,v]) => v && typeof v === "string" && v.trim());
    if (!entries.length) return fields;
    try { const r = await fetch(`${GS_URL}?action=translate&data=${encodeURIComponent(JSON.stringify(Object.fromEntries(entries)))}`); return { ...fields, ...await r.json() }; } catch { return fields; }
  },
  jira: async (epics) => { try { return await (await fetch(`${GS_URL}?action=jira&data=${encodeURIComponent(JSON.stringify(epics))}`)).json(); } catch(e) { return { ok:false, error:String(e) }; } },
  generateEpics: async (requirements, additionalContext) => {
    const res = await fetch(`${GS_URL}?action=generate_epics&data=${encodeURIComponent(JSON.stringify({ requirements, additionalContext }))}`);
    return await res.json();
  },
};

async function loadVoting() {
  const rows = await gs.get("scores_upvotes");
  let votes = {}, closed = false;
  rows.forEach(r => {
    if (r.id === "__voting_closed__") { closed = !!r.scores; return; }
    if (r.upvotes && Object.keys(r.upvotes).length) votes[r.id] = r.upvotes;
  });
  return { votes, closed };
}

  frequency:     { title:"How Often Does This Happen?", what:"Honest estimate of frequency in real production.", why:"Frequency is one of the biggest drivers of prioritization.", tips:["Always = virtually every project","Often = more than half","Sometimes = occasional","Rare but critical = low freq, high severity"] },

const TEAM_COLORS = [

  {bg:"bg-cyan-500",    light:"bg-cyan-50 border-cyan-400 text-cyan-700",         badge:"bg-cyan-100 text-cyan-800"},
  {bg:"bg-pink-500",    light:"bg-pink-50 border-pink-400 text-pink-700",         badge:"bg-pink-100 text-pink-800"},

const EMPTY_REQ = {problem:"",roleplayExample:"",frequency:"",stakeholders:[],consequences:[],agentPotential:"",workaround:"",definition:"",pipelineStage:"",impactScore:0,frequencyScore:0,riskScore:0,leverageScore:0};
const teamColor  = n => TEAM_COLORS[TEAMS.indexOf(n) % TEAM_COLORS.length] || TEAM_COLORS[0];
const agentBadge = a => ({"Assisted by AI":"bg-blue-100 text-blue-700","Fully automated":"bg-green-100 text-green-700","Orchestrated by an agent":"bg-purple-100 text-purple-700","Not suitable for AI":"bg-gray-100 text-gray-500"}[a]||"bg-gray-100 text-gray-500");
const buckBadge  = b => ({"Must-fix":"bg-rose-100 text-rose-700","Scale enabler":"bg-amber-100 text-amber-700","Strategic bet":"bg-indigo-100 text-indigo-700"}[b]||"bg-gray-100 text-gray-600");
const catBadge   = c => ({"Workflow Optimization":"bg-green-100 text-green-800","Agent Enablement":"bg-purple-100 text-purple-800","Structural Re-Architecture":"bg-red-100 text-red-800"}[c]||"bg-gray-100 text-gray-600");

const autoBucket = s => s>=16?"Must-fix":s>=10?"Scale enabler":"Strategic bet";
const top5ByTeam = (reqs, team) => [...reqs].filter(r=>r.team===team).sort((a,b)=>getScore(b)-getScore(a)).slice(0,5);

// ── Primitives ───────────────────────────────────────────────
function Badge({cls,children}){return <span className={`text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap ${cls}`}>{children}</span>;}
function Chip({label,active,onClick}){return <button onClick={onClick} className={`text-xs px-3 py-2 rounded-xl border-2 font-medium transition-all ${active?"bg-indigo-600 text-white border-indigo-600":"bg-white text-gray-600 border-gray-200 hover:border-indigo-300"}`}>{label}</button>;}
function MultiChips({options,selected,onChange}){return <div className="flex flex-wrap gap-2">{options.map(o=><Chip key={o} label={o} active={selected.includes(o)} onClick={()=>onChange(selected.includes(o)?selected.filter(x=>x!==o):[...selected,o])}/>)}</div>;}
function SyncBadge({status}){const map={syncing:"🔄 Syncing…",ok:"✅ Saved",error:"⚠️ Sync error"};if(!map[status])return null;return <span className={`text-xs font-semibold ${status==="syncing"?"text-indigo-500":status==="ok"?"text-emerald-600":"text-rose-600"}`}>{map[status]}</span>;}

function ScorePicker({label,emoji,value,onChange,color,desc}){
  const cls={blue:"bg-blue-600 border-blue-600",orange:"bg-orange-500 border-orange-500",red:"bg-red-600 border-red-600",indigo:"bg-indigo-600 border-indigo-600"};
  return <div className="space-y-1"><p className="text-xs font-semibold text-gray-700">{emoji} {label}</p><div className="flex gap-1">{[1,2,3,4,5].map(n=><button key={n} onClick={()=>onChange(n)} className={`w-8 h-8 rounded-lg border text-xs font-bold transition-all ${value===n?`${cls[color]} text-white`:"border-gray-300 text-gray-400 hover:border-indigo-300"}`}>{n}</button>)}</div>{desc&&<p className="text-xs text-gray-400 leading-relaxed">{desc}</p>}</div>;
}

function Section({step,bgColor,emoji,label,sublabel,children}){
  return(<div className="rounded-2xl border shadow-sm overflow-hidden"><div className={`${bgColor} px-5 py-4 flex items-center gap-3`}><div className="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center text-white font-black text-sm flex-shrink-0">{step}</div><div><p className="text-base font-black text-white">{emoji} {label}</p>{sublabel&&<p className="text-xs text-white opacity-80 mt-0.5">{sublabel}</p>}</div></div><div className="bg-white p-5 space-y-5">{children}</div></div>);
}

function Field({label,required,tipKey,children}){
  return(<div className="space-y-2"><div className="flex items-center gap-2"><label className="text-sm font-bold text-gray-800">{label}{required&&<span className="text-red-400"> *</span>}</label>{tipKey&&FIELD_TOOLTIPS[tipKey]&&<Tooltip tip={FIELD_TOOLTIPS[tipKey]}/>}</div>{children}</div>);
}

function Tooltip({tip}){
  const [open,setOpen]=useState(false);const ref=useRef(null);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);
  return(<div className="relative inline-block" ref={ref}><button onClick={()=>setOpen(o=>!o)} className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-500 text-xs font-black hover:bg-indigo-200 flex items-center justify-center">?</button>
    {open&&(<div className="absolute z-50 left-0 top-7 w-80 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 space-y-3">
      <p className="text-sm font-black text-gray-900">{tip.title}</p>
      <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">What</p><p className="text-xs text-gray-600 leading-relaxed">{tip.what}</p></div>
      <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Why it matters</p><p className="text-xs text-gray-600 leading-relaxed">{tip.why}</p></div>
      {tip.tips&&<div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Tips</p><ul className="space-y-1">{tip.tips.map((t,i)=><li key={i} className="text-xs text-gray-600 flex gap-1.5"><span className="text-indigo-400">→</span>{t}</li>)}</ul></div>}
      {(tip.bad||tip.good)&&<div className="space-y-2 pt-1 border-t">{tip.bad&&<div className="bg-red-50 rounded-xl px-3 py-2"><p className="text-xs font-bold text-red-500 mb-0.5">❌ Too vague</p><p className="text-xs text-red-700 italic">"{tip.bad}"</p></div>}{tip.good&&<div className="bg-green-50 rounded-xl px-3 py-2"><p className="text-xs font-bold text-green-600 mb-0.5">✅ Good example</p><p className="text-xs text-green-700 italic">"{tip.good}"</p></div>}</div>}
    </div>)}
  </div>);
}

function OtherSelect({options,value,onChange,placeholder}){
  const knownOptions=options.filter(o=>o!=="Other");
  const isCustom=value&&!knownOptions.includes(value)&&value!=="Other"&&value!=="";
  const [sel,setSel]=useState(isCustom?"Other":value||"");
  const [custom,setCustom]=useState(isCustom?value:"");
  const [showInput,setShowInput]=useState(isCustom);
  const handleSel=v=>{setSel(v);if(v==="Other"){setShowInput(true);onChange("");}else{setShowInput(false);setCustom("");onChange(v);}};
  return(<div className="space-y-1.5">
    <select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={sel} onChange={e=>handleSel(e.target.value)}><option value="">{placeholder||"Select…"}</option>{options.map(o=><option key={o}>{o}</option>)}</select>
    {showInput&&<input className="w-full border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-400" placeholder="Describe…" value={custom} onChange={e=>{setCustom(e.target.value);onChange(e.target.value);}}/>}
  </div>);
}

// ── Entry Screen ─────────────────────────────────────────────

          </div>)}

        </div>
        {selected&&(<div className={`rounded-xl border-2 px-4 py-3 flex items-center gap-3 ${tc.light}`}><div className="flex-1"><p className="text-sm font-black">{selected.name}</p><p className="text-xs opacity-70">{selected.team} · {TEAM_CONTEXT[selected.team]?.role}</p></div><span className="text-lg">{TEAM_CONTEXT[selected.team]?.emoji}</span></div>)}
        {selected&&(<div className="bg-gray-50 rounded-2xl p-4 space-y-2"><p className="text-xs font-black text-gray-500 uppercase tracking-wide">Your team</p><div className="flex flex-wrap gap-1.5">{TEAM_MEMBERS[selected.team].map((m,i)=><span key={i} className={`text-xs px-2.5 py-1 rounded-full font-medium ${m===selected.name?`${tc.bg} text-white`:tc.badge}`}>{m}</span>)}</div></div>)}
      </div>
      <div>
        <label className="text-sm font-bold text-gray-700 block mb-3">Which day is it?</label>
        <div className="grid grid-cols-2 gap-3">{[{d:1,label:"Day 1",sub:"Roleplay + Capture",emoji:"🎭"},{d:2,label:"Day 2",sub:"Synthesis + Engineering",emoji:"⚙️"}].map(({d,label,sub,emoji})=>(
          <button key={d} onClick={()=>setDay(d)} className={`py-4 rounded-xl border-2 text-sm font-semibold transition-all ${day===d?"bg-indigo-50 border-indigo-500 text-indigo-700":"border-gray-200 text-gray-400 hover:border-gray-300"}`}><div className="text-2xl mb-1">{emoji}</div><div className="font-bold">{label}</div><div className="text-xs opacity-70">{sub}</div></button>
        ))}</div>
      </div>
      <button onClick={()=>selected&&day&&onEnter(selected.team,day,selected.name)} disabled={!selected||!day} className="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold text-sm hover:bg-indigo-700 disabled:opacity-30 disabled:cursor-not-allowed">Enter the Hub →</button>
      {!selected&&<p className="text-center text-xs text-gray-300">Search your name to get started</p>}
    </div>
  </div>);
}

// ── Submit Tab ───────────────────────────────────────────────
function SubmitTab({user,onSave,syncStatus}){
  const [form,setForm]=useState(EMPTY_REQ);
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const canSubmit=!!(form.problem?.trim()&&form.roleplayExample?.trim()&&form.frequency&&form.definition?.trim());
  const missing=[!form.problem?.trim()&&"problem",!form.roleplayExample?.trim()&&"context",!form.frequency&&"frequency",!form.definition?.trim()&&"definition of solved"].filter(Boolean);
  const submit=async()=>{
    if(!canSubmit)return;setSaving(true);
    const req={...form,id:Date.now(),team:user.team,submittedBy:user.name||"",ts:new Date().toISOString(),cluster:"Unclustered",category:"",bucket:""};
    try{const t=await gs.translate({problem:req.problem,roleplayExample:req.roleplayExample,workaround:req.workaround,definition:req.definition});await onSave({...req,...t});}catch{await onSave(req);}
    setSaving(false);setForm(EMPTY_REQ);setDone(true);setTimeout(()=>setDone(false),3500);
  };
  const ta="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 resize-none placeholder-gray-300";
  const sel="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 bg-white";
  const steps=[{l:"Problem",ok:!!(form.problem?.trim()&&form.roleplayExample?.trim()&&form.frequency)},{l:"Impact",ok:!!(form.stakeholders.length||form.consequences.length||form.workaround?.trim())},{l:"Agent",ok:!!form.agentPotential},{l:"Solved when",ok:!!form.definition?.trim()}];
  return(<div className="space-y-4">
    {done&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",zIndex:9999}} className="bg-green-600 text-white rounded-2xl px-6 py-3 text-sm font-semibold shadow-xl">✅ Saved! Add another one.</div>}
    <div className="bg-white rounded-xl border px-4 py-3 flex items-center gap-2 flex-wrap">
      {steps.map((s,i)=><div key={i} className="flex items-center gap-1.5">{i>0&&<div className="w-4 h-px bg-gray-200"/>}<div className={`flex items-center gap-1 text-xs font-semibold ${s.ok?"text-indigo-600":"text-gray-400"}`}><div className={`w-4 h-4 rounded-full flex items-center justify-center text-xs ${s.ok?"bg-indigo-600 text-white":"bg-gray-100"}`}>{s.ok?"✓":i+1}</div>{s.l}</div></div>)}
      <span className="ml-auto flex items-center gap-2"><SyncBadge status={syncStatus}/><span className="text-xs text-gray-400 italic">✨ Auto-translated</span></span>
    </div>
    <Section step="1" bgColor="bg-indigo-700" emoji="🔍" label="The Requirement" sublabel="Capture what happened while it's fresh. Write in any language.">
      <Field label="What broke, slowed down or is missing?" required tipKey="problem"><textarea className={ta} rows={2} value={form.problem} onChange={e=>f("problem",e.target.value)} placeholder="e.g. Editors don't know the required video format until after they've finished the cut."/></Field>
      <Field label="Additional context & roleplay evidence" required tipKey="roleplay"><textarea className={ta} rows={4} value={form.roleplayExample} onChange={e=>f("roleplayExample",e.target.value)} placeholder="e.g. PM asked the client about aspect ratio. No response for 20 min. Editor assumed 9:16, finished the cut. Client replied asking for 16:9 — 45 min of rework."/></Field>
      <Field label="How often does this happen in real production?" required tipKey="frequency">
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{FREQUENCIES.map(fr=>{const m=FREQ_META[fr];return(<button key={fr} onClick={()=>f("frequency",fr)} className={`flex flex-col items-center gap-1 p-3 rounded-xl border-2 text-center transition-all ${form.frequency===fr?"bg-indigo-600 border-indigo-600 text-white":"border-gray-200 text-gray-600 hover:border-indigo-300"}`}><span className="text-lg">{m.emoji}</span><span className="text-xs font-bold">{fr}</span><span className={`text-xs ${form.frequency===fr?"text-indigo-200":"text-gray-400"}`}>{m.desc}</span></button>);})}</div>
      </Field>
      <Field label="Where in the pipeline does this happen?" tipKey="pipelineStage"><select className={sel} value={form.pipelineStage} onChange={e=>f("pipelineStage",e.target.value)}><option value="">Select a stage…</option>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select></Field>
    </Section>
    <Section step="2" bgColor="bg-rose-600" emoji="💥" label="The Impact" sublabel="Who suffers and what is it costing right now?">
      <Field label="Who feels the pain directly?" tipKey="stakeholders"><MultiChips options={STAKEHOLDERS} selected={form.stakeholders} onChange={v=>f("stakeholders",v)}/></Field>
      <Field label="What's the real cost of not fixing this?" tipKey="consequences"><MultiChips options={CONSEQUENCES} selected={form.consequences} onChange={v=>f("consequences",v)}/></Field>
      <Field label="How is the team handling this today?" tipKey="workaround"><textarea className={ta} rows={2} value={form.workaround} onChange={e=>f("workaround",e.target.value)} placeholder="e.g. Editor asks on Slack and waits. Sometimes guesses. ~20–45 min lost per project."/></Field>
    </Section>
    <Section step="3" bgColor="bg-violet-600" emoji="🤖" label="Agent Potential" sublabel="Could AI handle this step?">
      <Field label="If we were to automate this, what level makes sense?" tipKey="agentPotential">
        <div className="space-y-2">{AGENT_POTENTIALS.map(ap=>{const m=AGENT_META[ap];return(<button key={ap} onClick={()=>f("agentPotential",ap)} className={`w-full flex items-start gap-3 px-4 py-3 rounded-xl border-2 text-left transition-all ${form.agentPotential===ap?"bg-violet-600 border-violet-600 text-white":"bg-white border-gray-200 hover:border-violet-300"}`}><span className="text-xl flex-shrink-0">{m.emoji}</span><div><p className={`text-sm font-bold ${form.agentPotential===ap?"text-white":"text-gray-800"}`}>{ap}</p><p className={`text-xs mt-0.5 ${form.agentPotential===ap?"text-violet-200":"text-gray-500"}`}>{m.desc}</p></div>{form.agentPotential===ap&&<span className="ml-auto text-white">✓</span>}</button>);})}
      </Field>
    </Section>
    <Section step="4" bgColor="bg-emerald-600" emoji="🎯" label="Definition of Solved" sublabel="The most important question — what does success look like?">
      <Field label="How would we know this is fixed?" required tipKey="definition"><textarea className={ta} rows={4} value={form.definition} onChange={e=>f("definition",e.target.value)} placeholder="e.g. The brief always arrives at editing with the required format filled in. The editor never has to ask or guess."/></Field>
    </Section>
    <button onClick={submit} disabled={!canSubmit||saving} className="w-full bg-indigo-600 text-white rounded-xl py-4 font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-md">
      {saving?"✨ Translating & saving…":canSubmit?"Submit Requirement ✓":"Complete required fields to submit"}
    </button>
    {!canSubmit&&<p className="text-xs text-center text-gray-400">Still needed: {missing.join(" · ")}</p>}
  </div>);
}

// ── Requirements Tab (Day 1) ─────────────────────────────────
function RequirementsTab({reqs,user,onUpdate,onDelete,syncStatus}){
  const [expanded,setExpanded]=useState(null);
  const [editing,setEditing]=useState(null);
  const [editForm,setEditForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [fTeam,setFTeam]=useState(user.team);
  const [fStage,setFStage]=useState("All");

  const filtered=reqs.filter(r=>(fTeam==="All"||r.team===fTeam)&&(fStage==="All"||r.pipelineStage===fStage));
  const ranked=[...filtered].sort((a,b)=>getScore(b)-getScore(a));
  const top5ids=top5ByTeam(reqs,fTeam==="All"?user.team:fTeam).map(r=>r.id);
  const ta="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none";

  const saveScore=async(r,patch)=>{
    setSaving(true);
    await onUpdate(r.id,patch);
    setSaving(false);
  };

  return(<div className="space-y-4">
    <div className="bg-white rounded-xl border p-3 flex flex-wrap gap-2 items-center">
      <span className="text-xs font-semibold text-gray-500">Filter:</span>
      <select className="border rounded-lg px-2 py-1.5 text-xs" value={fTeam} onChange={e=>setFTeam(e.target.value)}><option value="All">All Teams</option>{TEAMS.map(t=><option key={t}>{t}</option>)}</select>
      <select className="border rounded-lg px-2 py-1.5 text-xs" value={fStage} onChange={e=>setFStage(e.target.value)}><option value="All">All Stages</option>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select>
      <span className="ml-auto flex items-center gap-2"><SyncBadge status={syncStatus}/><span className="text-xs text-gray-400">{ranked.length} item{ranked.length!==1?"s":""}</span></span>
    </div>

    <div className="bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-3 text-xs text-indigo-700">
      <p className="font-bold mb-1">⭐ Rate your team's requirements</p>
      <p>Expand each card to score it. The <strong>top 5 by score</strong> will be presented tomorrow. Scores are auto-saved.</p>
    </div>

    {ranked.length===0
      ?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No requirements yet.</p></div>
      :ranked.map((r,idx)=>{
        const tc=teamColor(r.team);
        const isOwner=r.team===user.team;
        const isEditing=editing===r.id;
        const score=getScore(r);
        const isTop5=top5ids.includes(r.id)&&score>0;
        return(<div key={r.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden ${isTop5?"border-l-4 border-l-indigo-500":""}`}>
          <div className="p-4 cursor-pointer hover:bg-gray-50" onClick={()=>!isEditing&&setExpanded(expanded===r.id?null:r.id)}>
            <div className="flex items-start gap-3">
              {isTop5&&<div className="flex-shrink-0 mt-0.5 text-lg" title="Top 5">{"🏆"}</div>}
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  <Badge cls={tc.badge}>{r.team}</Badge>
                  {r.submittedBy&&<Badge cls="bg-gray-100 text-gray-500">👤 {r.submittedBy}</Badge>}
                  {r.frequency&&<Badge cls="bg-indigo-100 text-indigo-800">{r.frequency}</Badge>}
                  {r.pipelineStage&&<Badge cls="bg-gray-100 text-gray-600">{r.pipelineStage}</Badge>}
                  {score>0&&<Badge cls="bg-slate-100 text-slate-700">⭐ {score}/20</Badge>}
                </div>
              </div>
              <span className="text-gray-300 text-lg mt-0.5">{expanded===r.id?"▲":"▼"}</span>
            </div>
          </div>

          {expanded===r.id&&!isEditing&&(<div className="border-t bg-slate-50 p-4 space-y-4">
            {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context & evidence</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
            <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
              {r.stakeholders?.length>0&&<div><span className="font-semibold text-gray-600">Affected: </span>{(Array.isArray(r.stakeholders)?r.stakeholders:[r.stakeholders]).join(", ")}</div>}
              {r.consequences?.length>0&&<div><span className="font-semibold text-gray-600">Cost: </span>{(Array.isArray(r.consequences)?r.consequences:[r.consequences]).join(", ")}</div>}
              {r.agentPotential&&<div><span className="font-semibold text-gray-600">Agent: </span>{r.agentPotential}</div>}
              {r.workaround&&<div className="col-span-2"><span className="font-semibold text-gray-600">Workaround: </span>{r.workaround}</div>}
            </div>
            {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}

            {/* Scoring section — only for own team */}
            {isOwner&&(<div className="bg-white rounded-xl border p-4 space-y-3">
              <p className="text-xs font-black text-gray-700 uppercase tracking-wide">⭐ Rate this requirement</p>
              <div className="grid grid-cols-2 gap-4">
                <ScorePicker label="Impact" emoji="💥" color="blue" value={r.impactScore||0} onChange={v=>saveScore(r,{impactScore:v})} desc="How severe is the pain?"/>
                <ScorePicker label="Frequency" emoji="🔁" color="orange" value={r.frequencyScore||0} onChange={v=>saveScore(r,{frequencyScore:v})} desc="How often in real production?"/>
                <ScorePicker label="Risk" emoji="⚠️" color="red" value={r.riskScore||0} onChange={v=>saveScore(r,{riskScore:v})} desc="Cost of NOT fixing this?"/>
                <ScorePicker label="Strategic leverage" emoji="🚀" color="indigo" value={r.leverageScore||0} onChange={v=>saveScore(r,{leverageScore:v})} desc="Does this unlock scale or AI?"/>
              </div>
              {score>0&&<div className="flex gap-3 text-xs text-gray-500 bg-slate-50 rounded-xl p-3"><span>💥{r.impactScore||0}</span><span>🔁{r.frequencyScore||0}</span><span>⚠️{r.riskScore||0}</span><span>🚀{r.leverageScore||0}</span><span className={`font-bold ml-auto ${score>=16?"text-rose-600":score>=10?"text-amber-600":"text-indigo-600"}`}>Total: {score}/20 — {autoBucket(score)}</span></div>}
            </div>)}

            {isOwner&&<div className="flex gap-2 pt-1">
              <button onClick={()=>{setEditing(r.id);setEditForm({...r});}} className="flex-1 py-2 border-2 border-indigo-200 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-50">✏️ Edit</button>
              <button onClick={()=>onDelete(r.id)} className="py-2 px-4 border-2 border-rose-200 text-rose-500 rounded-xl text-xs font-bold hover:bg-rose-50">🗑️ Delete</button>
            </div>}
          </div>)}

          {isEditing&&editForm&&(<div className="border-t bg-slate-50 p-4 space-y-3">
            <p className="text-xs font-bold text-gray-600">✏️ Editing — fields auto-translate to English on save</p>
            <textarea className={ta} rows={2} value={editForm.problem} onChange={e=>setEditForm(p=>({...p,problem:e.target.value}))} placeholder="Problem"/>
            <textarea className={ta} rows={3} value={editForm.roleplayExample} onChange={e=>setEditForm(p=>({...p,roleplayExample:e.target.value}))} placeholder="Context & evidence"/>
            <textarea className={ta} rows={2} value={editForm.definition} onChange={e=>setEditForm(p=>({...p,definition:e.target.value}))} placeholder="Definition of solved"/>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-bold text-gray-500 block mb-1">Frequency</label><select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={editForm.frequency} onChange={e=>setEditForm(p=>({...p,frequency:e.target.value}))}><option value="">Select…</option>{FREQUENCIES.map(f=><option key={f}>{f}</option>)}</select></div>
              <div><label className="text-xs font-bold text-gray-500 block mb-1">Pipeline stage</label><select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={editForm.pipelineStage||""} onChange={e=>setEditForm(p=>({...p,pipelineStage:e.target.value}))}><option value="">Select…</option>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select></div>
            </div>
            <div className="flex gap-2">
              <button onClick={async()=>{
                const translated=await gs.translate({problem:editForm.problem,roleplayExample:editForm.roleplayExample,workaround:editForm.workaround,definition:editForm.definition});
                await onUpdate(editForm.id,{...editForm,...translated});
                setEditing(null);setEditForm(null);
              }} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">💾 Save & Translate</button>
              <button onClick={()=>{setEditing(null);setEditForm(null);}} className="flex-1 py-2 border border-gray-200 rounded-xl text-xs font-bold text-gray-500">Cancel</button>
            </div>
          </div>)}
        </div>);
      })
    }
  </div>);
}

// ── Read-Out Tab (Day 2) ─────────────────────────────────────

              const translated=await gs.translate({problem:editForm.problem,roleplayExample:editForm.roleplayExample,workaround:editForm.workaround,definition:editForm.definition});
              await onUpdate(editForm.id,{...editForm,...translated});
              setEditing(false);setEditForm(null);
            }} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">💾 Save & Translate</button>
            <button onClick={()=>{setEditing(false);setEditForm(null);}} className="flex-1 py-2 border border-gray-200 rounded-xl text-xs font-bold text-gray-500">Cancel</button>
          </div>
        </div>)}

        <div className="flex gap-3">
          <button onClick={()=>{setCursor(c=>Math.max(0,c-1));setEditing(false);}} disabled={cursor===0} className="flex-1 py-3 rounded-xl border-2 text-sm font-bold disabled:opacity-30 hover:bg-gray-50">← Previous</button>
          <button onClick={()=>{setCursor(c=>Math.min(teamReqs.length-1,c+1));setEditing(false);}} disabled={cursor===teamReqs.length-1} className="flex-1 py-3 rounded-xl border-2 border-indigo-300 text-indigo-600 text-sm font-bold disabled:opacity-30 hover:bg-indigo-50">Next →</button>
        </div>
        <div className="space-y-1">{teamReqs.map((r,i)=>{const s=getScore(r);return<button key={r.id} onClick={()=>{setCursor(i);setEditing(false);}} className={`w-full text-left px-4 py-2.5 rounded-xl text-xs flex items-center gap-3 ${cursor===i?"bg-indigo-50 border border-indigo-200":"hover:bg-gray-50"}`}><span className="font-black text-gray-300 w-4">#{i+1}</span><span className={`font-semibold flex-1 ${cursor===i?"text-indigo-700":"text-gray-700"}`}>{r.problem}</span><span className={`font-bold text-xs ${s>=16?"text-rose-600":s>=10?"text-amber-600":"text-indigo-500"}`}>{s}pts</span></button>;})}</div>
      </>
    }
  </div>);
}

// ── Synthesis & Vote Tab (Day 2) ──────────────────────────────
function SynthesisVoteTab({reqs,votes,votingClosed,user,onVote,onCloseVoting,onResetVoting,onUpdateReq}){
  const [expanded,setExpanded]=useState(null);
  const vid=(user.name||user.team).toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
  const myVotes=votes[vid]||{};
  const myVotesList=Object.entries(myVotes).map(([id,pts])=>({id,pts:Number(pts)}));
  const myTotalUsed=myVotesList.reduce((s,v)=>s+v.pts,0);
  const MAX_VOTES=3;
  const getMyVote=id=>myVotes[String(id)]||0;
  const getTotalVotes=id=>{let t=0;Object.values(votes).forEach(v=>{t+=(Number(v[String(id)])||0);});return t;};
  // Count unique voters (people) who have cast at least one vote
  const allPeople=Object.values(TEAM_MEMBERS).flat();
  const voterIds=allPeople.map(n=>n.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,""));
  const totalPeople=allPeople.length;
  const votedCount=voterIds.filter(v=>Object.keys(votes[v]||{}).length>0).length;
  // Per-team voted status (at least one member voted)
  const teamVotedStatus=TEAMS.map(t=>{
    const members=TEAM_MEMBERS[t]||[];
    const voted=members.filter(n=>{const v=n.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");return Object.keys(votes[v]||{}).length>0;});
    return {team:t,voted:voted.length,total:members.length};
  });
  const ranked=[...reqs].sort((a,b)=>getScore(b)-getScore(a));
  const medals=["🥇","🥈","🥉"];

  // Results view (voting closed)
  if(votingClosed){
    const results=[...reqs].map(r=>({...r,totalVotes:getTotalVotes(r.id),selfScore:getScore(r)})).sort((a,b)=>(b.totalVotes+b.selfScore)-(a.totalVotes+a.selfScore));
    return(<div className="space-y-4">
      <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 flex items-center gap-3"><span className="text-2xl">🏁</span><div><p className="text-sm font-bold text-emerald-700">Voting closed — final ranking</p><p className="text-xs text-emerald-600">Sorted by votes + self-score combined</p></div></div>
      {results.map((r,i)=>{const tc=teamColor(r.team);const s=getScore(r);const bucket=autoBucket(s);return(<div key={r.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden ${i<3?"border-l-4 "+["border-l-yellow-400","border-l-gray-300","border-l-orange-400"][i]:""}`}>
        <div className="p-4 flex gap-3 items-start cursor-pointer hover:bg-gray-50" onClick={()=>setExpanded(expanded===r.id?null:r.id)}>
          <div className="text-2xl w-8 text-center flex-shrink-0">{medals[i]||`#${i+1}`}</div>
          <div className="flex-1 min-w-0 space-y-1">
            <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
            <div className="flex flex-wrap gap-1.5"><Badge cls={tc.badge}>{r.team}</Badge><span className={`text-xs px-2 py-0.5 rounded-full font-medium ${buckBadge(bucket)}`}>{bucket}</span></div>
            <div className="flex gap-3 text-xs text-gray-500 pt-1"><span>🗳️ {r.totalVotes} vote pts</span><span>⭐ {s} self-score</span><span className="font-bold text-indigo-600 ml-auto">Combined: {r.totalVotes+s}</span></div>
          </div>
          <span className="text-gray-300">{expanded===r.id?"▲":"▼"}</span>
        </div>
        {expanded===r.id&&<div className="border-t bg-slate-50 p-4 space-y-3">
          {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
          {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
          <div className="bg-white rounded-xl border p-3 space-y-2">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">📌 Optional classification</p>
            <div className="grid grid-cols-2 gap-3">
              <div><p className="text-xs font-bold text-gray-600 mb-1">🗂️ Cluster</p><OtherSelect options={BASE_CLUSTERS} value={r.cluster||"Unclustered"} onChange={v=>onUpdateReq(r.id,{cluster:v})} placeholder="Select cluster…"/></div>
              <div><p className="text-xs font-bold text-gray-600 mb-1">🏷️ Category</p><OtherSelect options={BASE_CATEGORIES} value={r.category||""} onChange={v=>onUpdateReq(r.id,{category:v})} placeholder="Select category…"/></div>
            </div>
          </div>
        </div>}
      </div>);})}
      <button onClick={onResetVoting} className="w-full py-2.5 border-2 border-gray-200 text-gray-400 rounded-xl text-xs font-bold hover:bg-gray-50">🔄 Reset voting</button>
    </div>);
  }

  // Active voting view
  return(<div className="space-y-4">
    {/* Score legend */}
    <div className="bg-white rounded-xl border p-4 space-y-2">
      <p className="text-xs font-bold text-gray-600">📊 Score = Impact + Frequency + Risk + Strategic (each 1–5, max 20)</p>
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"><p className="text-xs font-black text-rose-600">🔥 Must-fix</p><p className="text-xs font-bold text-gray-700">16–20</p><p className="text-xs text-gray-400">avg 4+</p></div>
        <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2"><p className="text-xs font-black text-amber-600">📈 Scale enabler</p><p className="text-xs font-bold text-gray-700">10–15</p><p className="text-xs text-gray-400">avg 2.5–3.75</p></div>
        <div className="bg-indigo-50 border border-indigo-200 rounded-lg px-3 py-2"><p className="text-xs font-black text-indigo-600">🚀 Strategic bet</p><p className="text-xs font-bold text-gray-700">1–9</p><p className="text-xs text-gray-400">avg below 2.5</p></div>
      </div>
    </div>

    {/* Vote budget */}
    <div className="bg-white rounded-xl border p-4 space-y-2">
      <div className="flex items-center justify-between"><p className="text-sm font-bold text-gray-800">🗳️ Your votes</p><span className="text-xs font-bold text-indigo-600">{myTotalUsed}/{MAX_VOTES} used</span></div>
      <p className="text-xs text-gray-500">Each person has <strong>3 votes total</strong>. You can put all 3 on a single item or spread them.</p>
      <div className="flex gap-1.5">{[...Array(MAX_VOTES)].map((_,i)=><div key={i} className={`flex-1 h-2 rounded-full ${i<myTotalUsed?"bg-indigo-500":"bg-gray-200"}`}/>)}</div>
      <div className="flex items-center justify-between text-xs text-gray-400">
        <span>{votedCount} of {totalPeople} people voted</span>
        {myTotalUsed>0&&<span className="text-indigo-500 font-semibold">{MAX_VOTES-myTotalUsed} remaining</span>}
      </div>
    </div>

    {/* Requirements list */}
    {ranked.map(r=>{
      const tc=teamColor(r.team);const score=getScore(r);const bucket=autoBucket(score);
      const myVote=getMyVote(r.id);const totalVotes=getTotalVotes(r.id);
      const remaining=MAX_VOTES-myTotalUsed;
      const isOpen=expanded===r.id;
      return(<div key={r.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden ${myVote>0?"border-indigo-300 border-2":""}`}>
        <div className="p-4">
          <div className="flex items-start gap-3 cursor-pointer" onClick={()=>setExpanded(isOpen?null:r.id)}>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
              <div className="flex flex-wrap gap-1.5 mt-1.5">
                <Badge cls={tc.badge}>{r.team}</Badge>
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${buckBadge(bucket)}`}>{bucket}</span>
                {r.frequency&&<Badge cls="bg-indigo-100 text-indigo-800">{r.frequency}</Badge>}
                {r.agentPotential&&<Badge cls={agentBadge(r.agentPotential)}>{r.agentPotential}</Badge>}
              </div>
            </div>
            <div className="text-right flex-shrink-0">
              <div className="text-xl font-black text-indigo-600">{score}</div>
              <div className="text-xs text-gray-400">score</div>
              {totalVotes>0&&<div className="text-xs font-bold text-emerald-600">{totalVotes}🗳️</div>}
            </div>
            <span className="text-gray-300 mt-1">{isOpen?"▲":"▼"}</span>
          </div>

          {/* Vote buttons */}
          <div className="flex gap-2 mt-3 items-center">
            <span className="text-xs text-gray-400 font-semibold flex-shrink-0">Vote:</span>
            {[1,2,3].map(n=>{
              const newVal=myVote===n?0:n;
              const wouldAdd=newVal-myVote;
              const canAdd=myTotalUsed+wouldAdd<=MAX_VOTES;
              const isActive=myVote===n;
              return(<button key={n} onClick={()=>(isActive||canAdd)&&onVote(r.id,newVal)}
                className={`flex-1 py-2 rounded-xl text-xs font-bold border-2 transition-all ${isActive?"bg-indigo-600 border-indigo-600 text-white":canAdd?"border-gray-200 text-gray-500 hover:border-indigo-300":"border-gray-100 text-gray-300 cursor-not-allowed"}`}>
                {isActive?"✓ ":""}{n} vote{n>1?"s":""}
              </button>);

            {myVote>0&&<button onClick={()=>onVote(r.id,0)} className="px-3 py-2 rounded-xl text-xs font-bold border-2 border-rose-200 text-rose-400 hover:bg-rose-50 flex-shrink-0">✕</button>}
          </div>
        </div>

        {/* Expanded details */}
        {isOpen&&<div className="border-t bg-slate-50 p-4 space-y-3">
          {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
          {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
          {r.workaround&&<p className="text-xs text-gray-600"><span className="font-semibold">Workaround: </span>{r.workaround}</p>}
          <div className="text-xs text-gray-400 flex gap-3"><span>💥{r.impactScore||0}</span><span>🔁{r.frequencyScore||0}</span><span>⚠️{r.riskScore||0}</span><span>🚀{r.leverageScore||0}</span></div>
          <div className="bg-white rounded-xl border p-3 space-y-2">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">📌 Optional classification</p>
            <div className="grid grid-cols-2 gap-3">
              <div><p className="text-xs font-bold text-gray-600 mb-1">🗂️ Cluster</p><OtherSelect options={BASE_CLUSTERS} value={r.cluster||"Unclustered"} onChange={v=>onUpdateReq(r.id,{cluster:v})} placeholder="Select cluster…"/></div>
              <div><p className="text-xs font-bold text-gray-600 mb-1">🏷️ Category</p><OtherSelect options={BASE_CATEGORIES} value={r.category||""} onChange={v=>onUpdateReq(r.id,{category:v})} placeholder="Select category…"/></div>
            </div>
          </div>
        </div>}
      </div>);
    })}

    {/* Voting controls */}
    <div className="bg-white rounded-xl border p-4 space-y-3">
      <div className="flex items-center justify-between"><p className="text-sm font-bold text-gray-700">Voting status</p><span className="text-xs text-gray-400">{votedCount}/{totalPeople} people voted</span></div>
      {teamVotedStatus.map(({team,voted,total})=>{const tc=teamColor(team);return(<div key={team} className="flex items-center gap-2 text-xs"><div className={`w-2 h-2 rounded-full flex-shrink-0 ${voted>0?"bg-emerald-500":"bg-gray-300"}`}/><span className={`flex-1 ${voted>0?"text-gray-700 font-semibold":"text-gray-400"}`}>{team}</span><span className={`${voted===total?"text-emerald-600 font-bold":"text-gray-400"}`}>{voted}/{total} voted</span></div>);})}

function EngineeringTab({reqs,votes,votingClosed}){
  const [step,setStep]=useState("select");
  const [selectedIds,setSelected]=useState([]);
  const [reqContexts,setReqContexts]=useState({});
  const [expandedReq,setExpandedReq]=useState(null);
  const [epics,setEpics]=useState([]);
  const [generating,setGenerating]=useState(false);
  const [genError,setGenError]=useState("");
  const [jsonInput,setJsonInput]=useState("");
  const [jsonError,setJsonError]=useState("");
  const [pushedReqIds,setPushedReqIds]=useState([]);
  const [pushResult,setPushResult]=useState(null);

  // Top 10 by votes
  const getTotalVotes=id=>{let t=0;Object.values(votes).forEach(v=>{t+=(Number(v[String(id)])||0);});return t;};
  const getScore2=r=>getScore(r)+getTotalVotes(r.id);
  const top10=[...reqs].sort((a,b)=>getScore2(b)-getScore2(a)).slice(0,10);

  const selectedReqs=top10.filter(r=>selectedIds.includes(r.id));
  const toggleReq=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll=()=>setSelected(selectedIds.length===top10.length?[]:top10.map(r=>r.id));
  const setCtx=(id,val)=>setReqContexts(p=>({...p,[id]:val}));

  const doGenerate=async()=>{
    if(!selectedIds.length)return;
    setGenerating(true);setGenError("");
    // Translate per-req contexts then attach
    const reqsWithCtx=await Promise.all(selectedReqs.map(async r=>{
      const ctx=reqContexts[r.id]||"";
      if(!ctx.trim())return r;
      try{const t=await gs.translate({additionalContext:ctx});return {...r,additionalContext:t.additionalContext||ctx};}catch{return {...r,additionalContext:ctx};}
    }));
    try{
      const data=await gs.generateEpics(reqsWithCtx,"");
      if(!data.ok||!Array.isArray(data.epics))throw new Error(data.error||"Unexpected response");
      setEpics(data.epics.map((e,i)=>({...e,id:Date.now()+i,approved:false,reqIds:(e.reqIds||[]).map(id=>String(id))})));
      setStep("review");
    }catch(err){setGenError("Error: "+err.message);}
    setGenerating(false);
  };

  const parseJson=()=>{
    setJsonError("");
    try{const parsed=JSON.parse(jsonInput.trim().replace(/```json|```/g,"").trim());if(!Array.isArray(parsed))throw new Error("Expected a JSON array");setEpics(parsed.map((e,i)=>({...e,id:Date.now()+i,approved:false,reqIds:(e.reqIds||[]).map(id=>String(id))})));setStep("review");}
    catch(err){setJsonError("Invalid JSON: "+err.message);}
  };
  const updateEpic=(idx,patch)=>setEpics(p=>p.map((e,i)=>i===idx?{...e,...patch}:e));
  const updateTicket=(eIdx,tIdx,patch)=>setEpics(p=>p.map((e,i)=>i===eIdx?{...e,tickets:e.tickets.map((t,j)=>j===tIdx?{...t,...patch}:t)}:e));
  const removeTicket=(eIdx,tIdx)=>setEpics(p=>p.map((e,i)=>i===eIdx?{...e,tickets:e.tickets.filter((_,j)=>j!==tIdx)}:e));
  const approvedEpics=epics.filter(e=>e.approved);

  const pushToJira=async()=>{
    if(!approvedEpics.length)return;setStep("pushing");
    const result=await gs.jira(approvedEpics);setPushResult(result);
    if(result?.ok){const ids=approvedEpics.flatMap(e=>e.reqIds||[]);setPushedReqIds(prev=>[...new Set([...prev,...ids])]);}
    setStep("done");
  };

  if(step==="done")return(<div className="space-y-4">
    {pushResult?.ok?<div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-8 text-center space-y-3"><p className="text-5xl">🎉</p><p className="text-xl font-black text-emerald-700">Done! Pushed to Jira</p><p className="text-sm text-emerald-600">Epics: <strong>{pushResult.keys?.join(", ")}</strong></p></div>
    :<div className="bg-rose-50 border border-rose-200 rounded-2xl p-8 text-center space-y-3"><p className="text-5xl">⚠️</p><p className="text-xl font-black text-rose-700">Something went wrong</p><p className="text-xs text-rose-500 font-mono">{pushResult?.error||"Unknown error"}</p></div>}
    <button onClick={()=>{setStep("select");setSelected([]);setEpics([]);setJsonInput("");setPushResult(null);}} className="w-full py-3 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50">← Start over</button>
  </div>);

  if(step==="pushing")return(<div className="flex flex-col items-center justify-center py-32 gap-4 text-gray-400"><div className="text-6xl animate-bounce">🚀</div><p className="text-sm font-bold text-gray-600">Pushing to Jira…</p></div>);

  if(step==="paste")return(<div className="flex gap-4 items-start">
    <div className="flex-1 min-w-0 space-y-4">
      <div className="bg-white rounded-xl border p-4 flex items-center justify-between"><div><p className="text-sm font-bold text-gray-800">Manual fallback — paste JSON</p></div><button onClick={()=>setStep("select")} className="text-xs text-gray-400 hover:text-gray-600">← Back</button></div>
      <textarea className={`w-full border-2 rounded-xl px-4 py-3 text-xs font-mono focus:outline-none resize-none h-48 ${jsonError?"border-rose-400":"border-gray-200 focus:border-indigo-400"}`} placeholder={'[\n  { "title": "...", ... }\n]'} value={jsonInput} onChange={e=>{setJsonInput(e.target.value);setJsonError("");}}/>
      {jsonError&&<p className="text-xs text-rose-600">{jsonError}</p>}
      <button onClick={parseJson} disabled={!jsonInput.trim()} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">Review Epics →</button>
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>);

  if(step==="review")return(<div className="flex gap-4 items-start">
    <div className="flex-1 min-w-0 space-y-4">
      <div className="bg-white rounded-xl border p-4 flex items-center justify-between"><div><p className="text-sm font-bold text-gray-800">Review & Approve Epics</p><p className="text-xs text-gray-400">Edit, approve, then push to Jira.</p></div><button onClick={()=>setStep("select")} className="text-xs text-gray-400 hover:text-gray-600">← Back</button></div>
      {epics.map((epic,eIdx)=>{
        const epicReqs=selectedReqs.filter(r=>(epic.reqIds||[]).includes(String(r.id)));
        return(<div key={eIdx} className={`bg-white rounded-2xl border-2 shadow-sm overflow-hidden ${epic.approved?"border-emerald-400":"border-gray-200"}`}>
          <div className={`px-4 py-3 flex items-center justify-between gap-3 ${epic.approved?"bg-emerald-50":"bg-gray-50"}`}>
            <div className="flex items-center gap-2 flex-wrap"><span className="text-xs font-black text-gray-400">EPIC {eIdx+1}</span>{epic.bucket&&<span className={`text-xs px-2 py-0.5 rounded-full font-medium ${buckBadge(epic.bucket)}`}>{epic.bucket}</span>}<span className="text-xs text-gray-400">{epicReqs.length} reqs · {epic.tickets?.length||0} tickets</span></div>
            <button onClick={()=>updateEpic(eIdx,{approved:!epic.approved})} className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border-2 transition-all ${epic.approved?"bg-emerald-500 border-emerald-500 text-white":"border-gray-300 text-gray-500 hover:border-emerald-400"}`}>{epic.approved?"✓ Approved":"Approve"}</button>
          </div>
          <div className="p-4 space-y-3">
            <div><label className="text-xs font-bold text-gray-500 block mb-1">Title</label><input className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:border-indigo-400" value={epic.title||""} onChange={e=>updateEpic(eIdx,{title:e.target.value})}/></div>
            <div><label className="text-xs font-bold text-gray-500 block mb-1">Description</label><textarea className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none" rows={2} value={epic.description||""} onChange={e=>updateEpic(eIdx,{description:e.target.value})}/></div>
            {epic.openQuestions?.length>0&&(<div className="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-1"><p className="text-xs font-bold text-amber-700">❓ Open questions</p>{epic.openQuestions.map((q,qi)=><p key={qi} className="text-xs text-amber-800 flex gap-1.5"><span>·</span>{q}</p>)}</div>)}
            {epicReqs.length>0&&<div className="space-y-1"><p className="text-xs font-bold text-gray-400">Linked requirements</p>{epicReqs.map(r=><div key={r.id} className="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-1.5"><span className="w-2 h-2 rounded-full bg-indigo-400 flex-shrink-0 mt-1"/>{r.problem}</div>)}</div>}
            {epic.tickets?.length>0&&(<div className="space-y-2 pt-1 border-t"><p className="text-xs font-bold text-gray-400 pt-1">Child tickets</p>
              {epic.tickets.map((t,tIdx)=>(<div key={tIdx} className="bg-slate-50 border border-gray-200 rounded-xl p-3 space-y-2">
                <div className="flex gap-2 items-center"><span className="text-xs font-black text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded flex-shrink-0">T{tIdx+1}</span><input className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400 bg-white" value={t.title||""} onChange={e=>updateTicket(eIdx,tIdx,{title:e.target.value})}/><button onClick={()=>removeTicket(eIdx,tIdx)} className="text-gray-300 hover:text-red-400 text-lg flex-shrink-0">×</button></div>
                {t.role&&t.goal&&<p className="text-xs text-gray-500 px-1">As a <strong>{t.role}</strong>, I want to {t.goal}{t.benefit?" "+t.benefit:""}</p>}
                {t.questions?.length>0&&<div className="bg-yellow-50 rounded-lg px-2 py-1.5">{t.questions.map((q,qi)=><p key={qi} className="text-xs text-yellow-700 flex gap-1"><span>❓</span>{q}</p>)}</div>}
                <div className="space-y-1">{(t.acs||[]).map((ac,ai)=><div key={ai} className="flex gap-2 items-start"><span className="text-xs text-gray-300 mt-1.5 flex-shrink-0">AC{ai+1}</span><input className="flex-1 border border-gray-100 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-indigo-300 bg-white" value={ac||""} onChange={e=>{const acs=[...t.acs];acs[ai]=e.target.value;updateTicket(eIdx,tIdx,{acs});}}/></div>)}</div>
              </div>))}
            </div>)}
          </div>
        </div>);
      })}
      <div className="sticky bottom-4 pt-2">
        <button onClick={pushToJira} disabled={!approvedEpics.length} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl">🚀 Push {approvedEpics.length} epic{approvedEpics.length!==1?"s":""} to Jira</button>
        {!approvedEpics.length&&<p className="text-center text-xs text-gray-400 mt-2">Approve at least one epic to continue</p>}
      </div>
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>);

  // Select step
  return(<div className="flex gap-4 items-start">
    <div className="flex-1 min-w-0 space-y-4">
      <div className="bg-white rounded-xl border p-4 space-y-1">
        <p className="text-sm font-bold text-gray-800">⚙️ Engineering — Top 10 requirements</p>
        <p className="text-xs text-gray-500">Ranked by votes + self-score. Select what to generate, add per-requirement context if needed.</p>
      </div>

      {top10.length===0
        ?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No voted requirements yet. Complete voting first.</p></div>
        :<>
          <div className="bg-white rounded-xl border p-3 flex items-center justify-between">
            <button onClick={toggleAll} className="text-xs font-bold text-indigo-600 hover:underline">{selectedIds.length===top10.length?"Deselect all":"Select all"}</button>
            <span className="text-xs text-gray-400">{selectedIds.length} of {top10.length} selected</span>
          </div>

          {top10.map((r,idx)=>{
            const tc=teamColor(r.team);const sel=selectedIds.includes(r.id);const score=getScore(r);const votes2=getTotalVotes(r.id);
            const isExpanded=expandedReq===r.id;const isPushed=pushedReqIds.includes(String(r.id));
            const bucket=autoBucket(score);
            return(<div key={r.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden ${sel?"border-indigo-200":""} ${isPushed?"border-l-4 border-l-emerald-400":""}`}>
              <div onClick={()=>toggleReq(r.id)} className={`flex items-start gap-3 px-4 py-3 cursor-pointer transition-all ${sel?"bg-indigo-50":"hover:bg-gray-50"}`}>
                <div className={`mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 ${sel?"bg-indigo-600 border-indigo-600":"border-gray-300"}`}>{sel&&<span className="text-white text-xs">✓</span>}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2"><span className="text-xs font-black text-gray-400">#{idx+1}</span><p className={`text-sm font-semibold ${sel?"text-indigo-800":"text-gray-800"}`}>{r.problem}</p></div>
                  <div className="flex flex-wrap gap-1.5 mt-1">
                    <Badge cls={tc.badge}>{r.team}</Badge>
                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${buckBadge(bucket)}`}>{bucket}</span>
                    {score>0&&<span className="text-xs text-indigo-500 font-bold">⭐{score}</span>}
                    {votes2>0&&<span className="text-xs text-emerald-600 font-bold">🗳️{votes2}</span>}
                    {isPushed&&<Badge cls="bg-emerald-100 text-emerald-700">✅ In Jira</Badge>}
                  </div>
                  {r.definition&&<p className="text-xs text-emerald-600 mt-1 italic">🎯 {r.definition?.slice(0,80)}{r.definition?.length>80?"…":""}</p>}
                </div>
                <button onClick={e=>{e.stopPropagation();setExpandedReq(isExpanded?null:r.id);}} className="text-gray-300 hover:text-gray-500 text-lg flex-shrink-0">{isExpanded?"▲":"▼"}</button>
              </div>

              {isExpanded&&<div className="border-t bg-slate-50 p-4 space-y-3">
                {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
                {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
                <div className="grid grid-cols-2 gap-3">
                  <div><p className="text-xs font-bold text-gray-600 mb-1">🗂️ Cluster</p><OtherSelect options={BASE_CLUSTERS} value={r.cluster||"Unclustered"} onChange={()=>{}} placeholder="Select cluster…"/></div>
                  <div><p className="text-xs font-bold text-gray-600 mb-1">🏷️ Category</p><OtherSelect options={BASE_CATEGORIES} value={r.category||""} onChange={()=>{}} placeholder="Select category…"/></div>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-600 block mb-1">💬 Additional context for this requirement <span className="text-gray-400 font-normal">(optional — gets translated to English)</span></label>
                  <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-400 resize-none bg-white" rows={3} placeholder="e.g. This is blocked by the Auth Service refactor in Q2. Prioritize after that ships." value={reqContexts[r.id]||""} onChange={e=>setCtx(r.id,e.target.value)}/>
                </div>
              </div>}
            </div>);
          })}

          <div className="sticky bottom-4 pt-2 space-y-2">
            {genError&&<div className="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3 text-xs text-rose-600 text-center">{genError} — <button onClick={()=>setStep("paste")} className="underline font-bold">paste manually instead</button></div>}
            <button onClick={doGenerate} disabled={!selectedIds.length||generating} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl transition-all">
              {generating?<span className="flex items-center justify-center gap-2"><span className="animate-spin inline-block">⚙️</span>Generating epics & tickets… (~20s)</span>:`✨ Generate epics & tickets from ${selectedIds.length} requirement${selectedIds.length!==1?"s":""}`}
            </button>
            {selectedIds.length>0&&!generating&&<p className="text-center text-xs text-gray-400">Powered by Claude via Apps Script</p>}
          </div>
        </>
      }
    </div>
    <div className="w-64 flex-shrink-0"><BestPracticesPanel/></div>
  </div>);
}

// ── Main App ─────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);const [day,setDay]=useState(1);const [tab,setTab]=useState(0);
  const [reqs,setReqs]=useState([]);const [votes,setVotes]=useState({});const [votingClosed,setVotingClosed]=useState(false);
  const [loading,setLoading]=useState(true);const [syncStatus,setSync]=useState("idle");const [lastRefresh,setRefresh]=useState(null);

  const loadAll=async()=>{
    const [reqRows,vot]=await Promise.all([gs.get("requirements"),loadVoting()]);
    setReqs(reqRows);setVotes(vot.votes);setVotingClosed(vot.closed);setRefresh(new Date());
  };
  useEffect(()=>{loadAll().finally(()=>setLoading(false));},[]);
  useEffect(()=>{if(!user)return;const iv=setInterval(loadAll,30000);return()=>clearInterval(iv);},[user]);

  const withSync=async fn=>{setSync("syncing");try{await fn();setSync("ok");setTimeout(()=>setSync("idle"),2500);}catch{setSync("error");setTimeout(()=>setSync("idle"),4000);}};
  const addReq=async req=>{setSync("syncing");try{await gs.upsert("requirements",req);await loadAll();setSync("ok");setTimeout(()=>setSync("idle"),2500);}catch{setSync("error");setTimeout(()=>setSync("idle"),4000);}};
  const updateReq=async(id,patch)=>{const updated=reqs.map(r=>r.id===id?{...r,...patch}:r);setReqs(updated);await withSync(()=>gs.upsert("requirements",updated.find(r=>r.id===id)));};
  const deleteReq=async id=>{setReqs(p=>p.filter(r=>r.id!==id));await withSync(()=>gs.del("requirements",id));};

  // voter ID is per-person, not per-team
  const voterId = user => (user.name||user.team).toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
  const castVote=async(reqId,pts)=>{
    const vid=voterId(user);const sid=String(reqId);
    setVotes(prev=>{const myVotes={...(prev[vid]||{})};if(pts===0){delete myVotes[sid];}else{myVotes[sid]=pts;}const next={...prev,[vid]:myVotes};gs.upsert("scores_upvotes",{id:vid,scores:{},upvotes:myVotes});return next;});
  };
  const closeVoting=async()=>{setVotingClosed(true);await gs.upsert("scores_upvotes",{id:"__voting_closed__",scores:true,upvotes:{}});};
  const resetVoting=async()=>{
    if(!window.confirm("Reset all votes? This cannot be undone."))return;
    setVotes({});setVotingClosed(false);
    await gs.del("scores_upvotes","__voting_closed__");
    // clear every known person
    for(const members of Object.values(TEAM_MEMBERS)){
      for(const name of members){
        const vid=name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
        await gs.upsert("scores_upvotes",{id:vid,scores:{},upvotes:{}});
      }
    }
  };

  if(loading)return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#9ca3af",gap:"12px"}}><div style={{fontSize:"2.5rem"}}>⚡</div><p style={{fontSize:"0.875rem"}}>Loading from Google Sheets…</p></div>);
  if(!user)return <EntryScreen onEnter={(t,d,name)=>{setUser({team:t,name});setDay(d);setTab(0);}}/>;

  const tc=teamColor(user.team);const tabs=day===1?TABS_D1:TABS_D2;

  return(<div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50">
    <div className="bg-indigo-700 text-white px-6 py-4 flex items-center justify-between shadow-lg">
      <div><h1 className="text-xl font-bold">⚡ Offsite Hub</h1>
        <div className="flex items-center gap-2 mt-0.5"><span className={`text-xs px-2 py-0.5 rounded-full font-bold ${day===1?"bg-amber-400 text-amber-900":"bg-emerald-400 text-emerald-900"}`}>Day {day}</span><p className="text-indigo-300 text-xs">{day===1?"Roleplay + Capture":"Synthesis + Engineering"}</p></div>
      </div>
      <div className="text-right">
        <span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${tc.bg} text-white`}>{user.name||user.team}</span>
        <p className="text-indigo-300 text-xs mt-0.5 opacity-70">{user.team}</p>
        <p className="text-indigo-300 text-xs cursor-pointer hover:text-white" onClick={()=>setUser(null)}>Switch →</p>
      </div>
    </div>
    <div className="bg-white border-b px-6 py-2.5 flex gap-4 text-xs text-gray-500 flex-wrap items-center">
      <span>📌 <strong className="text-gray-800">{reqs.length}</strong> requirements</span>
      <span>🏷️ <strong className="text-gray-800">{[...new Set(reqs.map(r=>r.team))].length}</strong> teams</span>
      {votingClosed&&<span className="text-rose-600 font-bold">🏁 Voting closed</span>}
      <span className="flex items-center gap-1.5"><SyncBadge status={syncStatus}/>{syncStatus==="idle"&&lastRefresh&&<span className="text-gray-300">Synced {lastRefresh.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>}</span>
      <button onClick={()=>setDay(d=>d===1?2:1)} className="ml-auto text-indigo-500 hover:underline">Switch to Day {day===1?2:1} →</button>
    </div>
    <div className="flex border-b bg-white px-4 overflow-x-auto">
      {tabs.map((t,i)=><button key={i} onClick={()=>setTab(i)} className={`px-4 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition-colors ${tab===i?"border-indigo-600 text-indigo-700":"border-transparent text-gray-500 hover:text-gray-700"}`}>{t}</button>)}
    </div>
    <div className={`${day===2&&tab===2?"px-5 py-5":"max-w-3xl mx-auto p-5"} space-y-4`}>
      {day===1&&<TeamContextPanel team={user.team}/>}
      {day===1&&tab===0&&<SubmitTab user={user} onSave={addReq} syncStatus={syncStatus}/>}
      {day===1&&tab===1&&<RequirementsTab reqs={reqs} user={user} onUpdate={updateReq} onDelete={deleteReq} syncStatus={syncStatus}/>}
      {day===2&&tab===0&&<ReadOutTab reqs={reqs} onUpdate={updateReq}/>}
      {day===2&&tab===1&&<SynthesisVoteTab reqs={reqs} votes={votes} votingClosed={votingClosed} user={user} onVote={castVote} onCloseVoting={closeVoting} onResetVoting={resetVoting} onUpdateReq={updateReq}/>}
      {day===2&&tab===2&&<EngineeringTab reqs={reqs} votes={votes} votingClosed={votingClosed}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
