const GS_URL = "https://script.google.com/macros/s/AKfycbxxVRHIN6wJzC56mjt-B1Cipji0xg0Wq0CH2F2kd4UivvOLjs49gxmJ4WrBTuc7XC64/exec";

async function gsGet(sheet) {
  try { const res = await fetch(`${GS_URL}?sheet=${encodeURIComponent(sheet)}`); return await res.json(); } catch { return []; }
}
async function gsUpsert(sheet, data) {
  try { await fetch(`${GS_URL}?action=upsert&sheet=${encodeURIComponent(sheet)}&data=${encodeURIComponent(JSON.stringify(data))}`); } catch {}
}
async function gsDelete(sheet, id) {
  try { await fetch(`${GS_URL}?action=delete&sheet=${encodeURIComponent(sheet)}&data=${encodeURIComponent(JSON.stringify({id}))}`); } catch {}
}
async function gsTranslate(fields) {
  const toTranslate = Object.entries(fields).filter(([,v]) => v && typeof v === "string" && v.trim());
  if (!toTranslate.length) return fields;
  try {
    const url = `${GS_URL}?action=translate&data=${encodeURIComponent(JSON.stringify(Object.fromEntries(toTranslate)))}`;
    const res = await fetch(url);
    const translated = await res.json();
    return { ...fields, ...translated };
  } catch { return fields; }
}
async function gsJira(epics) {
  try {
    const res = await fetch(`${GS_URL}?action=jira&data=${encodeURIComponent(JSON.stringify(epics))}`);
    return await res.json();
  } catch(e) { return { ok: false, error: String(e) }; }
}
async function loadScoresUpvotes() {
  const rows = await gsGet("scores_upvotes");
  let scores = {}, upvotes = {}, votingClosed = false;
  rows.forEach(r => {
    if (r.id === "__voting_closed__") { votingClosed = !!r.scores; return; }
    if (r.scores)  scores[r.id]  = r.scores;
    if (r.upvotes) upvotes[r.id] = r.upvotes;
  });
  return { scores, upvotes, votingClosed };
}

// ── Tooltip ──────────────────────────────────────────────────
function Tooltip({tip}) {
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);
  return(
    <div className="relative inline-block" ref={ref}>
      <button onClick={()=>setOpen(o=>!o)} className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-500 text-xs font-black hover:bg-indigo-200 flex items-center justify-center flex-shrink-0">?</button>
      {open&&(
        <div className="absolute z-50 left-0 top-7 w-80 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 space-y-3">
          <p className="text-sm font-black text-gray-900">{tip.title}</p>
          <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">What</p><p className="text-xs text-gray-600 leading-relaxed">{tip.what}</p></div>
          <div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Why it matters</p><p className="text-xs text-gray-600 leading-relaxed">{tip.why}</p></div>
          {tip.tips&&<div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Tips</p><ul className="space-y-1">{tip.tips.map((t,i)=><li key={i} className="text-xs text-gray-600 flex gap-1.5"><span className="text-indigo-400 flex-shrink-0">→</span>{t}</li>)}</ul></div>}
          {tip.stages&&<div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide mb-1">Stages reference</p><ul className="space-y-1">{tip.stages.map((s,i)=><li key={i} className="text-xs text-gray-500 flex gap-1.5"><span className="text-indigo-400 flex-shrink-0">·</span>{s}</li>)}</ul></div>}
          {(tip.bad||tip.good)&&<div className="space-y-2 pt-1 border-t border-gray-100">{tip.bad&&<div className="bg-red-50 rounded-xl px-3 py-2"><p className="text-xs font-bold text-red-500 mb-0.5">❌ Too vague</p><p className="text-xs text-red-700 italic">"{tip.bad}"</p></div>}{tip.good&&<div className="bg-green-50 rounded-xl px-3 py-2"><p className="text-xs font-bold text-green-600 mb-0.5">✅ Good example</p><p className="text-xs text-green-700 italic">"{tip.good}"</p></div>}</div>}
        </div>
      )}
    </div>
  );
}

// ── Primitives ───────────────────────────────────────────────
function Badge({cls,children}){return <span className={`text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap ${cls}`}>{children}</span>;}
function Chip({label,active,onClick}){return <button onClick={onClick} className={`text-xs px-3 py-2 rounded-xl border-2 font-medium transition-all ${active?"bg-indigo-600 text-white border-indigo-600":"bg-white text-gray-600 border-gray-200 hover:border-indigo-300"}`}>{label}</button>;}
function MultiChips({options,selected,onChange}){return <div className="flex flex-wrap gap-2">{options.map(o=><Chip key={o} label={o} active={selected.includes(o)} onClick={()=>onChange(selected.includes(o)?selected.filter(x=>x!==o):[...selected,o])}/>)}</div>;}
function ScorePicker({label,emoji,value,onChange,color}){
  const cls={blue:"bg-blue-600 border-blue-600",orange:"bg-orange-500 border-orange-500",red:"bg-red-600 border-red-600",indigo:"bg-indigo-600 border-indigo-600"};
  return <div className="space-y-1"><p className="text-xs font-semibold text-gray-600">{emoji} {label}</p><div className="flex gap-1">{[1,2,3,4,5].map(n=><button key={n} onClick={()=>onChange(n)} className={`w-8 h-8 rounded-lg border text-xs font-bold transition-all ${value===n?`${cls[color]} text-white`:"border-gray-300 text-gray-400 hover:border-indigo-300"}`}>{n}</button>)}</div></div>;
}
function Section({step,bgColor,emoji,label,sublabel,children}){return(<div className="rounded-2xl border shadow-sm overflow-hidden"><div className={`${bgColor} px-5 py-4 flex items-center gap-3`}><div className="w-8 h-8 rounded-full bg-white bg-opacity-20 flex items-center justify-center text-white font-black text-sm flex-shrink-0">{step}</div><div><p className="text-base font-black text-white">{emoji} {label}</p>{sublabel&&<p className="text-xs text-white opacity-80 mt-0.5">{sublabel}</p>}</div></div><div className="bg-white p-5 space-y-5">{children}</div></div>);}
function Field({label,required,tipKey,children}){return(<div className="space-y-2"><div className="flex items-center gap-2"><label className="text-sm font-bold text-gray-800">{label}{required&&<span className="text-red-400"> *</span>}</label>{tipKey&&FIELD_TOOLTIPS[tipKey]&&<Tooltip tip={FIELD_TOOLTIPS[tipKey]}/>}</div>{children}</div>);}
function SyncBadge({status}){const map={syncing:"🔄 Syncing…",ok:"✅ Saved",error:"⚠️ Sync error"};const cls={syncing:"text-indigo-500",ok:"text-emerald-600",error:"text-rose-600"};if(!map[status])return null;return <span className={`text-xs font-semibold ${cls[status]}`}>{map[status]}</span>;}

// ── OtherSelect ──────────────────────────────────────────────
function OtherSelect({options,value,onChange,placeholder}){
  const isOther = value && !options.filter(o=>o!=="Other").includes(value) && value!=="Other" && value!=="";
  const [showInput,setShowInput]=useState(isOther);
  const [selectVal,setSelectVal]=useState(isOther?"Other":value||"");
  const [inputVal,setInputVal]=useState(isOther?value:"");
  const handleSelect=v=>{setSelectVal(v);if(v==="Other"){setShowInput(true);onChange("");}else{setShowInput(false);setInputVal("");onChange(v);}};
  const handleInput=v=>{setInputVal(v);onChange(v);};
  return(<div className="space-y-2">
    <select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={selectVal} onChange={e=>handleSelect(e.target.value)}>
      <option value="">{placeholder||"Select…"}</option>{options.map(o=><option key={o}>{o}</option>)}
    </select>
    {showInput&&<input className="w-full border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-400" placeholder="Describe the cluster…" value={inputVal} onChange={e=>handleInput(e.target.value)}/>}
  </div>);
}

// ── Submit tab ───────────────────────────────────────────────
function SubmitTab({user,onSave,syncStatus}){
  const [form,setForm]=useState(EMPTY_REQ);
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const canSubmit=!!(form.problem?.trim()&&form.roleplayExample?.trim()&&form.frequency&&form.definition?.trim());
  const missing=[!form.problem?.trim()&&"problem",!form.roleplayExample?.trim()&&"context",!form.frequency&&"frequency",!form.definition?.trim()&&"definition of solved"].filter(Boolean);
  const submit=async()=>{
    if(!canSubmit)return;
    setSaving(true);
    const req={...form,id:Date.now(),team:user.team,ts:new Date().toISOString(),cluster:"Unclustered",category:"",bucket:""};
    try{const translated=await gsTranslate({problem:req.problem,roleplayExample:req.roleplayExample,workaround:req.workaround,definition:req.definition});await onSave({...req,...translated});}
    catch{await onSave(req);}
    setSaving(false);setForm(EMPTY_REQ);setDone(true);setTimeout(()=>setDone(false),3500);
  };
  const ta="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 resize-none transition-colors placeholder-gray-300";
  const sel="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 bg-white";
  const steps=[{l:"Problem",ok:!!(form.problem?.trim()&&form.roleplayExample?.trim()&&form.frequency)},{l:"Impact",ok:!!(form.stakeholders.length||form.consequences.length||form.workaround?.trim())},{l:"Agent",ok:!!form.agentPotential},{l:"Solved when",ok:!!form.definition?.trim()},{l:"Rate",ok:!!(form.impactScore&&form.frequencyScore&&form.riskScore&&form.leverageScore)}];
  return(
    <div className="space-y-4">
      {done&&<div style={{position:"fixed",bottom:"24px",left:"50%",transform:"translateX(-50%)",zIndex:9999}} className="bg-green-600 text-white rounded-2xl px-6 py-3 text-sm font-semibold shadow-xl">✅ Saved to Google Sheets! Add another one.</div>}
      <div className="bg-white rounded-xl border px-4 py-3 flex items-center gap-2 flex-wrap">
        {steps.map((s,i)=><div key={i} className="flex items-center gap-1.5">{i>0&&<div className="w-4 h-px bg-gray-200"/>}<div className={`flex items-center gap-1 text-xs font-semibold ${s.ok?"text-indigo-600":"text-gray-400"}`}><div className={`w-4 h-4 rounded-full flex items-center justify-center text-xs ${s.ok?"bg-indigo-600 text-white":"bg-gray-100"}`}>{s.ok?"✓":i+1}</div>{s.l}</div></div>)}
        <span className="ml-auto flex items-center gap-2"><SyncBadge status={syncStatus}/><span className="text-xs text-gray-400 italic">✨ Auto-translated</span></span>
      </div>

      <Section step="1" bgColor="bg-indigo-700" emoji="🔍" label="The Requirement" sublabel="Capture what happened while it's fresh. Write in any language.">
        <Field label="Is this a bug or a new feature?" required>
          <div className="flex gap-3">{ISSUE_TYPES.map(t=><button key={t} onClick={()=>f("issueType",t)} className={`flex-1 py-3 rounded-xl border-2 text-sm font-bold transition-all ${form.issueType===t?"bg-indigo-600 border-indigo-600 text-white":"border-gray-200 text-gray-500 hover:border-indigo-300"}`}>{t==="Bug"?"🐛 Bug":"✨ New Feature"}</button>)}</div>
        </Field>
        <Field label={form.issueType==="Bug"?"What broke, slowed down or created risk?":"What new capability or feature is needed?"} required tipKey="problem">
          <textarea className={ta} rows={2} value={form.problem} onChange={e=>f("problem",e.target.value)} placeholder={form.issueType==="Bug"?"e.g. Editors don't know the required video format until after they've finished the cut.":"e.g. There's no way to preview how a super will look before sending for client review."} />
        </Field>
        <Field label="Additional context & roleplay evidence" required tipKey="roleplay">
          <textarea className={ta} rows={4} value={form.roleplayExample} onChange={e=>f("roleplayExample",e.target.value)} placeholder="e.g. PM asked the client about aspect ratio in Slack. No response for 20 min. Editor assumed 9:16 and finished the cut. Client replied asking for 16:9 — 45 min of rework." />
        </Field>
        <Field label="How often does this happen in real production?" required tipKey="frequency">
          <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{FREQUENCIES.map(fr=>{const m=FREQ_META[fr];return(<button key={fr} onClick={()=>f("frequency",fr)} className={`flex flex-col items-center gap-1 p-3 rounded-xl border-2 text-center transition-all ${form.frequency===fr?"bg-indigo-600 border-indigo-600 text-white":"border-gray-200 text-gray-600 hover:border-indigo-300"}`}><span className="text-lg">{m.emoji}</span><span className="text-xs font-bold">{fr}</span><span className={`text-xs ${form.frequency===fr?"text-indigo-200":"text-gray-400"}`}>{m.desc}</span></button>);})}</div>
        </Field>
        <Field label="Where in the pipeline does this happen?" tipKey="pipelineStage">
          <select className={sel} value={form.pipelineStage} onChange={e=>f("pipelineStage",e.target.value)}><option value="">Select a stage…</option>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select>
        </Field>
      </Section>

      <Section step="2" bgColor="bg-rose-600" emoji="💥" label="The Impact" sublabel="Who suffers and what is it costing right now?">
        <Field label="Who feels the pain directly?" tipKey="stakeholders"><MultiChips options={STAKEHOLDERS} selected={form.stakeholders} onChange={v=>f("stakeholders",v)}/></Field>
        <Field label="What's the real cost of not fixing this?" tipKey="consequences"><MultiChips options={CONSEQUENCES} selected={form.consequences} onChange={v=>f("consequences",v)}/></Field>
        <Field label="How is the team handling this today?" tipKey="workaround"><textarea className={ta} rows={2} value={form.workaround} onChange={e=>f("workaround",e.target.value)} placeholder="e.g. Editor asks on Slack and waits. Sometimes guesses. ~20–45 min lost per project."/></Field>
      </Section>

      <Section step="3" bgColor="bg-violet-600" emoji="🤖" label="Agent Potential" sublabel="Could AI handle this step?">
        <Field label="If we were to automate this, what level makes sense?" tipKey="agentPotential">
          <div className="space-y-2">{AGENT_POTENTIALS.map(ap=>{const m=AGENT_META[ap];return(<button key={ap} onClick={()=>f("agentPotential",ap)} className={`w-full flex items-start gap-3 px-4 py-3 rounded-xl border-2 text-left transition-all ${form.agentPotential===ap?"bg-violet-600 border-violet-600 text-white":"bg-white border-gray-200 hover:border-violet-300"}`}><span className="text-xl flex-shrink-0">{m.emoji}</span><div><p className={`text-sm font-bold ${form.agentPotential===ap?"text-white":"text-gray-800"}`}>{ap}</p><p className={`text-xs mt-0.5 ${form.agentPotential===ap?"text-violet-200":"text-gray-500"}`}>{m.desc}</p></div>{form.agentPotential===ap&&<span className="ml-auto text-white text-sm">✓</span>}</button>);})}</div>
        </Field>
      </Section>

      <Section step="4" bgColor="bg-emerald-600" emoji="🎯" label="Definition of Solved" sublabel="The most important question — and the one teams skip most often.">
        <Field label="How would we know this is fixed?" required tipKey="definition"><textarea className={ta} rows={4} value={form.definition} onChange={e=>f("definition",e.target.value)} placeholder="e.g. The brief always arrives at editing with the required format filled in. The editor never has to ask or guess."/></Field>
      </Section>

      <Section step="5" bgColor="bg-slate-700" emoji="⭐" label="Your Rating" sublabel="Rate this requirement from your perspective before submitting.">
        <div className="grid grid-cols-2 gap-4">
          <div className="space-y-1">
            <ScorePicker label="Impact" emoji="💥" color="blue" value={form.impactScore} onChange={v=>f("impactScore",v)}/>
            <p className="text-xs text-gray-400 leading-relaxed">How severe is the pain? How much does this affect output quality, client satisfaction, or team efficiency?</p>
          </div>
          <div className="space-y-1">
            <ScorePicker label="Frequency" emoji="🔁" color="orange" value={form.frequencyScore} onChange={v=>f("frequencyScore",v)}/>
            <p className="text-xs text-gray-400 leading-relaxed">How often does this come up in real production? 1 = rare edge case, 5 = happens on virtually every project.</p>
          </div>
          <div className="space-y-1">
            <ScorePicker label="Risk" emoji="⚠️" color="red" value={form.riskScore} onChange={v=>f("riskScore",v)}/>
            <p className="text-xs text-gray-400 leading-relaxed">What's the downside of NOT fixing this? Consider client churn, team burnout, errors reaching clients, or legal/compliance exposure.</p>
          </div>
          <div className="space-y-1">
            <ScorePicker label="Strategic leverage" emoji="🚀" color="indigo" value={form.leverageScore} onChange={v=>f("leverageScore",v)}/>
            <p className="text-xs text-gray-400 leading-relaxed">If fixed, does this unlock scale, enable AI automation, or unblock multiple other problems? High leverage = fixing this makes many other things easier.</p>
          </div>
        </div>
        <p className="text-xs text-gray-400 pt-1 border-t">1 = low · 5 = critical &nbsp;·&nbsp; Max total score: 20</p>
      </Section>

      <button onClick={submit} disabled={!canSubmit||saving} className="w-full bg-indigo-600 text-white rounded-xl py-4 font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-md">
        {saving?"✨ Translating & saving…":canSubmit?"Submit Requirement ✓":"Complete required fields to submit"}
      </button>
      {!canSubmit&&<p className="text-xs text-center text-gray-400">Still needed: {missing.join(" · ")}</p>}
    </div>
  );
}

// ── Requirements tab ─────────────────────────────────────────
function RequirementsTab({reqs,user,onUpdate,onDelete}){
  const [expanded,setExpanded]=useState(null);
  const [editing,setEditing]=useState(null);
  const [editForm,setEditForm]=useState(null);
  const [fTeam,setFTeam]=useState("All");
  const [fStage,setFStage]=useState("All");
  const [fType,setFType]=useState("All");
  const filtered=reqs.filter(r=>(fTeam==="All"||r.team===fTeam)&&(fStage==="All"||r.pipelineStage===fStage)&&(fType==="All"||r.issueType===fType));
  const startEdit=r=>{setEditing(r.id);setEditForm({...r});};
  const saveEdit=async()=>{await onUpdate(editForm.id,editForm);setEditing(null);setEditForm(null);};
  const ta="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none";
  return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-3 flex flex-wrap gap-2 items-center">
        <span className="text-xs font-semibold text-gray-500">Filter:</span>
        <select className="border rounded-lg px-2 py-1.5 text-xs" value={fTeam} onChange={e=>setFTeam(e.target.value)}><option value="All">All Teams</option>{TEAMS.map(t=><option key={t}>{t}</option>)}</select>
        <select className="border rounded-lg px-2 py-1.5 text-xs" value={fStage} onChange={e=>setFStage(e.target.value)}><option value="All">All Stages</option>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select>
        <select className="border rounded-lg px-2 py-1.5 text-xs" value={fType} onChange={e=>setFType(e.target.value)}><option value="All">All Types</option>{ISSUE_TYPES.map(t=><option key={t}>{t}</option>)}</select>
        <span className="ml-auto text-xs text-gray-400">{filtered.length} item{filtered.length!==1?"s":""}</span>
      </div>
      {filtered.length===0
        ?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No requirements yet.</p></div>
        :filtered.map(r=>{
          const tc=teamColor(r.team);
          const isOwner=r.team===user.team;
          const isEditing=editing===r.id;
          const avgScore=((r.impactScore||0)+(r.frequencyScore||0)+(r.riskScore||0)+(r.leverageScore||0));
          return(
            <div key={r.id} className="bg-white rounded-xl border shadow-sm overflow-hidden">
              <div className="p-4 cursor-pointer hover:bg-gray-50" onClick={()=>!isEditing&&setExpanded(expanded===r.id?null:r.id)}>
                <div className="flex items-start gap-3">
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      <Badge cls={tc.badge}>{r.team}</Badge>
                      {r.issueType&&<Badge cls={typeBadge(r.issueType)}>{r.issueType}</Badge>}
                      {r.frequency&&<Badge cls="bg-indigo-100 text-indigo-800">{r.frequency}</Badge>}
                      {r.pipelineStage&&<Badge cls="bg-gray-100 text-gray-600">{r.pipelineStage}</Badge>}
                    </div>
                  </div>
                  {avgScore>0&&<div className="text-center flex-shrink-0"><div className="text-xl font-black text-indigo-600">{avgScore}</div><div className="text-xs text-gray-400">pts</div></div>}
                </div>
              </div>
              {expanded===r.id&&!isEditing&&(
                <div className="border-t bg-slate-50 p-4 space-y-3">
                  {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context & evidence</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
                  <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                    {r.stakeholders?.length>0&&<div><span className="font-semibold text-gray-600">Affected: </span>{(Array.isArray(r.stakeholders)?r.stakeholders:[r.stakeholders]).join(", ")}</div>}
                    {r.consequences?.length>0&&<div><span className="font-semibold text-gray-600">Cost: </span>{(Array.isArray(r.consequences)?r.consequences:[r.consequences]).join(", ")}</div>}
                    {r.agentPotential&&<div><span className="font-semibold text-gray-600">Agent: </span>{r.agentPotential}</div>}
                    {r.workaround&&<div><span className="font-semibold text-gray-600">Workaround: </span>{r.workaround}</div>}
                  </div>
                  {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
                  {avgScore>0&&<div className="flex gap-3 text-xs text-gray-500 bg-white rounded-xl p-3 border"><span>💥 {r.impactScore||0}</span><span>🔁 {r.frequencyScore||0}</span><span>⚠️ {r.riskScore||0}</span><span>🚀 {r.leverageScore||0}</span><span className="font-bold text-indigo-600 ml-auto">Total: {avgScore}</span></div>}
                  {isOwner&&<div className="flex gap-2 pt-1"><button onClick={()=>startEdit(r)} className="flex-1 py-2 border-2 border-indigo-200 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-50">✏️ Edit</button><button onClick={()=>onDelete(r.id)} className="py-2 px-4 border-2 border-rose-200 text-rose-500 rounded-xl text-xs font-bold hover:bg-rose-50">🗑️ Delete</button></div>}
                </div>
              )}
              {isEditing&&editForm&&(
                <div className="border-t bg-slate-50 p-4 space-y-3">
                  <p className="text-xs font-bold text-gray-600">Editing requirement</p>
                  <textarea className={ta} rows={2} value={editForm.problem} onChange={e=>setEditForm(p=>({...p,problem:e.target.value}))} placeholder="Problem"/>
                  <textarea className={ta} rows={3} value={editForm.roleplayExample} onChange={e=>setEditForm(p=>({...p,roleplayExample:e.target.value}))} placeholder="Context & evidence"/>
                  <textarea className={ta} rows={2} value={editForm.definition} onChange={e=>setEditForm(p=>({...p,definition:e.target.value}))} placeholder="Definition of solved"/>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="text-xs font-bold text-gray-500 block mb-1">Frequency</label><select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={editForm.frequency} onChange={e=>setEditForm(p=>({...p,frequency:e.target.value}))}><option value="">Select…</option>{FREQUENCIES.map(f=><option key={f}>{f}</option>)}</select></div>
                    <div><label className="text-xs font-bold text-gray-500 block mb-1">Type</label><select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={editForm.issueType||"New Feature"} onChange={e=>setEditForm(p=>({...p,issueType:e.target.value}))}>{ISSUE_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
                  </div>
                  <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
                    <ScorePicker label="Impact" emoji="💥" color="blue" value={editForm.impactScore||0} onChange={v=>setEditForm(p=>({...p,impactScore:v}))}/>
                    <ScorePicker label="Frequency" emoji="🔁" color="orange" value={editForm.frequencyScore||0} onChange={v=>setEditForm(p=>({...p,frequencyScore:v}))}/>
                    <ScorePicker label="Risk" emoji="⚠️" color="red" value={editForm.riskScore||0} onChange={v=>setEditForm(p=>({...p,riskScore:v}))}/>
                    <ScorePicker label="Strategic" emoji="🚀" color="indigo" value={editForm.leverageScore||0} onChange={v=>setEditForm(p=>({...p,leverageScore:v}))}/>
                  </div>
                  <div className="flex gap-2"><button onClick={saveEdit} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Save</button><button onClick={()=>{setEditing(null);setEditForm(null);}} className="flex-1 py-2 border border-gray-200 rounded-xl text-xs font-bold text-gray-500">Cancel</button></div>
                </div>
              )}
            </div>
          );
        })
      }
    </div>
  );
}

// ── Read-Out tab ─────────────────────────────────────────────
function ReadOutTab({reqs}){
  const [activeTeam,setActiveTeam]=useState(TEAMS[0]);
  const [cursor,setCursor]=useState(0);
  const activeTeams=[...new Set(reqs.map(r=>r.team))];
  const teamReqs=reqs.filter(r=>r.team===activeTeam);
  const current=teamReqs[cursor];
  return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-3 flex flex-wrap gap-2">{activeTeams.map(t=>{const tc=teamColor(t);return <button key={t} onClick={()=>{setActiveTeam(t);setCursor(0);}} className={`px-3 py-1.5 rounded-full text-xs font-bold border-2 transition-all ${activeTeam===t?tc.light:"border-gray-200 text-gray-500"}`}>{t}</button>;})}</div>
      {teamReqs.length===0
        ?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No requirements from {activeTeam} yet.</p></div>
        :<>
          {current&&(
            <div className="bg-white rounded-2xl border-2 border-indigo-200 shadow-lg p-6 space-y-4 min-h-64">
              <div className="flex items-center justify-between"><Badge cls={teamColor(current.team).badge}>{current.team}</Badge><div className="flex items-center gap-2">{current.issueType&&<Badge cls={typeBadge(current.issueType)}>{current.issueType}</Badge>}<span className="text-xs font-bold text-gray-400">{cursor+1} / {teamReqs.length}</span></div></div>
              <p className="text-xl font-black text-gray-900 leading-snug">{current.problem}</p>
              <div className="flex flex-wrap gap-2">{current.frequency&&<div className="flex gap-1.5 items-center"><span className="text-lg">{FREQ_META[current.frequency]?.emoji}</span><span className="text-sm font-semibold text-gray-600">{current.frequency}</span></div>}{current.agentPotential&&<Badge cls={agentBadge(current.agentPotential)}>{current.agentPotential}</Badge>}</div>
              {current.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-4"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context & evidence</p><p className="text-sm text-amber-900 leading-relaxed">{current.roleplayExample}</p></div>}
              {current.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-sm text-emerald-900 leading-relaxed">{current.definition}</p></div>}
            </div>
          )}
          <div className="flex gap-3"><button onClick={()=>setCursor(c=>Math.max(0,c-1))} disabled={cursor===0} className="flex-1 py-3 rounded-xl border-2 text-sm font-bold disabled:opacity-30 hover:bg-gray-50">← Previous</button><button onClick={()=>setCursor(c=>Math.min(teamReqs.length-1,c+1))} disabled={cursor===teamReqs.length-1} className="flex-1 py-3 rounded-xl border-2 border-indigo-300 text-indigo-600 text-sm font-bold disabled:opacity-30 hover:bg-indigo-50">Next →</button></div>
          <div className="space-y-1">{teamReqs.map((r,i)=><button key={r.id} onClick={()=>setCursor(i)} className={`w-full text-left px-4 py-2.5 rounded-xl text-xs transition-all flex items-center gap-3 ${cursor===i?"bg-indigo-50 border border-indigo-200":"hover:bg-gray-50"}`}><span className="font-black text-gray-300 w-4">#{i+1}</span><span className={`font-semibold flex-1 ${cursor===i?"text-indigo-700":"text-gray-700"}`}>{r.problem}</span><span className="text-gray-400">{r.frequency}</span></button>)}</div>
        </>
      }
    </div>
  );
}

// ── Synthesis tab ─────────────────────────────────────────────
function SynthesisTab({reqs,onUpdateReq}){
  const [expanded,setExpanded]=useState(null);
  const getScore=r=>((r.impactScore||0)+(r.frequencyScore||0)+(r.riskScore||0)+(r.leverageScore||0));
  const ranked=[...reqs].sort((a,b)=>getScore(b)-getScore(a));
  const autoBucket=s=>s>=16?"Must-fix":s>=10?"Scale enabler":"Strategic bet";
  return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-4 space-y-3">
        <div><p className="font-bold text-gray-800 text-sm">Facilitator view — Colo / Ale</p><p className="text-xs text-gray-500 mt-0.5">Requirements ordered by score. Expand each one to see full details before assigning cluster and category.</p></div>
        <div className="bg-slate-50 rounded-xl p-3 space-y-1">
          <p className="text-xs font-bold text-gray-600 mb-2">📊 Score = Impact + Frequency + Risk + Strategic (each 1–5, max 20)</p>
          <div className="flex flex-col gap-1">
            <div className="flex items-center gap-2 text-xs"><span className="w-24 font-bold text-rose-600">🔥 Must-fix</span><span className="text-gray-400">score 16–20</span><span className="text-gray-300 mx-1">·</span><span className="text-gray-500">avg 4+ across all criteria</span></div>
            <div className="flex items-center gap-2 text-xs"><span className="w-24 font-bold text-amber-600">📈 Scale enabler</span><span className="text-gray-400">score 10–15</span><span className="text-gray-300 mx-1">·</span><span className="text-gray-500">avg 2.5–3.75</span></div>
            <div className="flex items-center gap-2 text-xs"><span className="w-24 font-bold text-indigo-600">🚀 Strategic bet</span><span className="text-gray-400">score 1–9</span><span className="text-gray-300 mx-1">·</span><span className="text-gray-500">avg below 2.5</span></div>
          </div>
        </div>
      </div>
      {ranked.length===0?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No requirements yet.</p></div>:ranked.map((r,idx)=>{
        const tc=teamColor(r.team);const score=getScore(r);const suggested=autoBucket(score);const isOpen=expanded===r.id;
        return(
          <div key={r.id} className="bg-white rounded-xl border shadow-sm overflow-hidden">
            {/* Header row — always visible */}
            <div className="p-4 flex items-start gap-3 cursor-pointer hover:bg-gray-50" onClick={()=>setExpanded(isOpen?null:r.id)}>
              <div className="flex-shrink-0 w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-xs font-black text-indigo-600">#{idx+1}</div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  <Badge cls={tc.badge}>{r.team}</Badge>
                  {r.issueType&&<Badge cls={typeBadge(r.issueType)}>{r.issueType}</Badge>}
                  {r.frequency&&<Badge cls="bg-indigo-100 text-indigo-800">{r.frequency}</Badge>}
                  {r.agentPotential&&<Badge cls={agentBadge(r.agentPotential)}>{r.agentPotential}</Badge>}
                  {r.cluster&&r.cluster!=="Unclustered"&&<Badge cls="bg-slate-100 text-slate-600">🗂️ {r.cluster}</Badge>}
                  {r.category&&<Badge cls={catBadge(r.category)}>{r.category}</Badge>}
                </div>
              </div>
              <div className="flex-shrink-0 text-center bg-indigo-50 rounded-xl px-3 py-1.5 min-w-14">
                <div className="text-2xl font-black text-indigo-600 leading-tight">{score}</div>
                <div className="text-xs text-gray-400">score</div>
                {score>0&&<div className="flex gap-0.5 justify-center mt-1 text-xs text-gray-400"><span>💥{r.impactScore||0}</span><span>·</span><span>🔁{r.frequencyScore||0}</span><span>·</span><span>⚠️{r.riskScore||0}</span><span>·</span><span>🚀{r.leverageScore||0}</span></div>}
              </div>
              <span className="text-gray-300 text-lg flex-shrink-0 mt-0.5">{isOpen?"▲":"▼"}</span>
            </div>

            {/* Expanded details */}
            {isOpen&&(
              <div className="border-t bg-slate-50 p-4 space-y-4">
                {/* Full requirement info */}
                {r.roleplayExample&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-3"><p className="text-xs font-bold text-amber-700 mb-1">📝 Context & evidence</p><p className="text-xs text-amber-800 leading-relaxed">{r.roleplayExample}</p></div>}
                {r.definition&&<div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><p className="text-xs font-bold text-emerald-700 mb-1">🎯 Definition of solved</p><p className="text-xs text-emerald-800 leading-relaxed">{r.definition}</p></div>}
                <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs bg-white rounded-xl p-3 border">
                  {r.pipelineStage&&<div><span className="font-semibold text-gray-500">Pipeline stage: </span><span className="text-gray-700">{r.pipelineStage}</span></div>}
                  {r.stakeholders?.length>0&&<div><span className="font-semibold text-gray-500">Affected: </span><span className="text-gray-700">{(Array.isArray(r.stakeholders)?r.stakeholders:[r.stakeholders]).join(", ")}</span></div>}
                  {r.consequences?.length>0&&<div><span className="font-semibold text-gray-500">Cost: </span><span className="text-gray-700">{(Array.isArray(r.consequences)?r.consequences:[r.consequences]).join(", ")}</span></div>}
                  {r.workaround&&<div className="col-span-2"><span className="font-semibold text-gray-500">Workaround: </span><span className="text-gray-700">{r.workaround}</span></div>}
                </div>

                {/* Cluster / Category / Bucket assignment */}
                <div className="bg-white rounded-xl border p-3 space-y-3">
                  <p className="text-xs font-bold text-gray-600">Assign</p>
                  <div className="grid grid-cols-3 gap-2">
                    <div><label className="text-xs font-bold text-gray-500 block mb-1">Cluster</label><OtherSelect options={BASE_CLUSTERS} value={r.cluster||"Unclustered"} onChange={v=>onUpdateReq(r.id,{cluster:v})} placeholder="Select cluster…"/></div>
                    <div><label className="text-xs font-bold text-gray-500 block mb-1">Category</label><OtherSelect options={BASE_CATEGORIES} value={r.category||""} onChange={v=>onUpdateReq(r.id,{category:v})} placeholder="Select category…"/></div>
                    <div><label className="text-xs font-bold text-gray-500 block mb-1">Bucket <span className="text-gray-300 font-normal">(sugg: {suggested})</span></label><select className="w-full border rounded-lg px-2 py-1.5 text-xs bg-white" value={r.bucket||suggested} onChange={e=>onUpdateReq(r.id,{bucket:e.target.value})}>{BUCKETS.map(b=><option key={b}>{b}</option>)}</select></div>
                  </div>
                  {r.category&&CAT_META[r.category]&&<p className="text-xs text-gray-400 italic">{CAT_META[r.category].desc}</p>}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Voting tab ───────────────────────────────────────────────
function VotingTab({reqs,votes,votingClosed,user,onVote,onCloseVoting}){
  const vid=user.team.toLowerCase().replace(/\s+/g,"-");
  const myVotes=votes[vid]||{};
  const myVotesList=Object.entries(myVotes).map(([id,pts])=>({id,pts})).sort((a,b)=>b.pts-a.pts);
  const usedPoints=myVotesList.reduce((s,v)=>s+v.pts,0);
  const maxPoints=6; // 3+2+1
  const availablePoints=[3,2,1].filter(p=>!myVotesList.find(v=>v.pts===p));
  const getMyVote=id=>myVotes[id]||0;
  const getTotalVotes=id=>{let t=0;Object.values(votes).forEach(v=>{t+=(v[id]||0);});return t;};
  const votersWhoVoted=Object.keys(votes).filter(v=>Object.keys(votes[v]||{}).length>0);
  const ranked=[...reqs].map(r=>({...r,totalVotes:getTotalVotes(r.id),selfScore:((r.impactScore||0)+(r.frequencyScore||0)+(r.riskScore||0)+(r.leverageScore||0))})).sort((a,b)=>(b.totalVotes+b.selfScore)-(a.totalVotes+a.selfScore));
  const medals=["🥇","🥈","🥉"];
  if(votingClosed) return(
    <div className="space-y-4">
      <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 flex items-center gap-3"><span className="text-2xl">🏁</span><div><p className="text-sm font-bold text-emerald-700">Voting closed!</p><p className="text-xs text-emerald-600">Final ranking by votes + self-score</p></div></div>
      {ranked.map((r,i)=>{const tc=teamColor(r.team);return(
        <div key={r.id} className={`bg-white rounded-xl border shadow-sm p-4 flex gap-3 items-start ${i<3?"border-l-4 "+["border-l-yellow-400","border-l-gray-300","border-l-orange-400"][i]:""}`}>
          <div className="text-2xl w-8 text-center flex-shrink-0">{medals[i]||`#${i+1}`}</div>
          <div className="flex-1 min-w-0 space-y-1">
            <p className="text-sm font-semibold text-gray-800">{r.problem}</p>
            <div className="flex flex-wrap gap-1.5"><Badge cls={tc.badge}>{r.team}</Badge>{r.issueType&&<Badge cls={typeBadge(r.issueType)}>{r.issueType}</Badge>}</div>
            <div className="flex gap-3 text-xs text-gray-500 pt-1"><span>🗳️ {r.totalVotes} vote pts</span><span>⭐ {r.selfScore} self score</span><span className="font-bold text-indigo-600 ml-auto">Total: {r.totalVotes+r.selfScore}</span></div>
          </div>
        </div>
      );})}
    </div>
  );
  return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-4 space-y-2">
        <div className="flex items-center justify-between"><p className="text-sm font-bold text-gray-800">🗳️ Cast your votes</p><span className="text-xs text-gray-400">{votersWhoVoted.length} of {TEAMS.length} teams voted</span></div>
        <p className="text-xs text-gray-500">You have 3 votes: worth <strong>3pts</strong>, <strong>2pts</strong>, and <strong>1pt</strong>. You can put multiple votes on the same item.</p>
        <div className="flex gap-2 flex-wrap">
          {[3,2,1].map(p=>{const used=myVotesList.find(v=>v.pts===p);const label=used?(reqs.find(r=>String(r.id)===used.id)?.problem?.slice(0,20)+"…"||"voted"):"available";return(<div key={p} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border-2 ${used?"bg-indigo-600 border-indigo-600 text-white":"border-gray-200 text-gray-400"}`}>{p}pt {used?"→ "+label:label}</div>);})}
        </div>
      </div>
      {reqs.map(r=>{
        const tc=teamColor(r.team);const myVote=getMyVote(r.id);const total=getTotalVotes(r.id);
        return(
          <div key={r.id} className={`bg-white rounded-xl border shadow-sm overflow-hidden ${myVote>0?"border-indigo-300":""}`}>
            <div className="p-4">
              <div className="flex items-start gap-3">
                <div className="flex-1 min-w-0"><p className="text-sm font-semibold text-gray-800">{r.problem}</p>
                  <div className="flex flex-wrap gap-1.5 mt-1.5"><Badge cls={tc.badge}>{r.team}</Badge>{r.issueType&&<Badge cls={typeBadge(r.issueType)}>{r.issueType}</Badge>}{r.frequency&&<Badge cls="bg-indigo-100 text-indigo-800">{r.frequency}</Badge>}</div>
                </div>
                <div className="text-center flex-shrink-0"><div className="text-2xl font-black text-indigo-600">{total}</div><div className="text-xs text-gray-400">pts</div></div>
              </div>
              <div className="flex gap-2 mt-3">
                {[3,2,1].map(p=>{const isActive=myVote===p;const isUsed=!isActive&&!!myVotesList.find(v=>v.pts===p);return(<button key={p} disabled={isUsed} onClick={()=>onVote(r.id,isActive?0:p)} className={`flex-1 py-2 rounded-xl text-xs font-bold border-2 transition-all ${isActive?"bg-indigo-600 border-indigo-600 text-white":isUsed?"border-gray-100 text-gray-300 cursor-not-allowed":"border-gray-200 text-gray-500 hover:border-indigo-300"}`}>{isActive?"✓ ":""}{p}pt{p!==1?"s":""}</button>);})}
                {myVote>0&&<button onClick={()=>onVote(r.id,0)} className="px-3 py-2 rounded-xl text-xs font-bold border-2 border-rose-200 text-rose-400 hover:bg-rose-50">✕</button>}
              </div>
            </div>
          </div>
        );
      })}
      <div className="bg-white rounded-xl border p-4 space-y-3">
        <div className="flex items-center justify-between"><p className="text-sm font-bold text-gray-700">Close voting</p><span className="text-xs text-gray-400">{votersWhoVoted.length}/{TEAMS.length} teams voted</span></div>
        {TEAMS.map(t=>{const v=t.toLowerCase().replace(/\s+/g,"-");const voted=Object.keys(votes[v]||{}).length>0;return <div key={t} className="flex items-center gap-2 text-xs"><div className={`w-2 h-2 rounded-full ${voted?"bg-emerald-500":"bg-gray-300"}`}/><span className={voted?"text-gray-700 font-semibold":"text-gray-400"}>{t}</span>{voted&&<span className="text-emerald-500">✓ voted</span>}</div>;})}
        <button onClick={onCloseVoting} className="w-full py-3 bg-rose-600 text-white rounded-xl text-sm font-bold hover:bg-rose-700">🏁 Close voting & show results</button>
      </div>
    </div>
  );
}

// ── Engineering tab ──────────────────────────────────────────
function EngineeringTab({reqs}){
  const [step,setStep]=useState("select"); // select | review | pushing | done
  const [selectedIds,setSelected]=useState([]);
  const [jsonInput,setJsonInput]=useState("");
  const [jsonError,setJsonError]=useState("");
  const [epics,setEpics]=useState([]);
  const [pushResult,setPushResult]=useState(null);
  const [copied,setCopied]=useState(false);
  const clusterOf=r=>r.cluster&&r.cluster!=="Unclustered"?r.cluster:"Unclustered";
  const byCluster=reqs.reduce((acc,r)=>{const c=clusterOf(r);if(!acc[c])acc[c]=[];acc[c].push(r);return acc;},{});
  const toggleReq=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleAll=()=>setSelected(selectedIds.length===reqs.length?[]:reqs.map(r=>r.id));
  const selectedReqs=reqs.filter(r=>selectedIds.includes(r.id));
  const buildPrompt=()=>{
    const reqSummary=selectedReqs.map(r=>`- ID: ${r.id}\n  Type: ${r.issueType||"n/a"}\n  Cluster: ${clusterOf(r)}\n  Problem: ${r.problem}\n  Definition of solved: ${r.definition||"n/a"}\n  Agent potential: ${r.agentPotential||"n/a"}\n  Workaround: ${r.workaround||"n/a"}\n  Affected: ${(Array.isArray(r.stakeholders)?r.stakeholders:[r.stakeholders||""]).filter(Boolean).join(", ")||"unknown"}`).join("\n");
    return `You are a senior PM at Airpost, an AI-powered ad production platform.\n\nGroup the following requirements into Jira epics. Multiple requirements can belong to the same epic if they are related. Be smart about grouping.\n\nRequirements:\n${reqSummary}\n\nRespond ONLY with a valid JSON array. No explanation, no markdown, just raw JSON:\n[\n  {\n    "title": "Epic title",\n    "description": "Clear description",\n    "bucket": "Must-fix" | "Scale enabler" | "Strategic bet",\n    "reqIds": [array of requirement IDs],\n    "tickets": [\n      {\n        "title": "Ticket title",\n        "role": "who benefits",\n        "goal": "what they want to achieve",\n        "acs": ["Given... When... Then...", "Given... When... Then...", "Given... When... Then..."]\n      }\n    ]\n  }\n]`;
  };
  const copyAndOpen=async()=>{
    try{await navigator.clipboard.writeText(buildPrompt());}catch{}
    setCopied(true);setTimeout(()=>setCopied(false),4000);
    window.open("https://claude.ai","_blank");
    setStep("paste");
  };
  const parseJson=()=>{
    setJsonError("");
    try{
      const parsed=JSON.parse(jsonInput.trim().replace(/```json|```/g,"").trim());
      if(!Array.isArray(parsed))throw new Error("Expected a JSON array");
      setEpics(parsed.map((e,i)=>({...e,id:Date.now()+i,approved:false,reqIds:(e.reqIds||[]).map(id=>typeof id==="string"?id:String(id))})));
      setStep("review");
    }catch(err){setJsonError("Invalid JSON — paste exactly what Claude gave you: "+err.message);}
  };
  const updateEpic=(idx,patch)=>setEpics(p=>p.map((e,i)=>i===idx?{...e,...patch}:e));
  const updateTicket=(eIdx,tIdx,patch)=>setEpics(p=>p.map((e,i)=>i===eIdx?{...e,tickets:e.tickets.map((t,j)=>j===tIdx?{...t,...patch}:t)}:e));
  const removeTicket=(eIdx,tIdx)=>setEpics(p=>p.map((e,i)=>i===eIdx?{...e,tickets:e.tickets.filter((_,j)=>j!==tIdx)}:e));
  const approvedEpics=epics.filter(e=>e.approved);
  const pushToJira=async()=>{
    if(!approvedEpics.length)return;
    setStep("pushing");
    const result=await gsJira(approvedEpics);
    setPushResult(result);
    setStep("done");
  };
  if(step==="done")return(
    <div className="space-y-4">
      {pushResult?.ok
        ?<div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-8 text-center space-y-3"><p className="text-5xl">🎉</p><p className="text-xl font-black text-emerald-700">Done! Pushed to Jira</p><p className="text-sm text-emerald-600">Epics: <strong>{pushResult.keys?.join(", ")}</strong></p><p className="text-xs text-emerald-500">Sprint "{pushResult.sprint||"Airpost Offsite 2026"}" created.</p></div>
        :<div className="bg-rose-50 border border-rose-200 rounded-2xl p-8 text-center space-y-3"><p className="text-5xl">⚠️</p><p className="text-xl font-black text-rose-700">Something went wrong</p><p className="text-xs text-rose-500 font-mono">{pushResult?.error||"Unknown error"}</p></div>
      }
      <button onClick={()=>{setStep("select");setSelected([]);setEpics([]);setJsonInput("");setPushResult(null);}} className="w-full py-3 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-50">← Start over</button>
    </div>
  );
  if(step==="pushing")return(<div className="flex flex-col items-center justify-center py-32 gap-4 text-gray-400"><div className="text-6xl animate-bounce">🚀</div><p className="text-sm font-bold text-gray-600">Pushing to Jira…</p><p className="text-xs">Creating epics, subtasks and sprint</p></div>);
  if(step==="review")return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-4 flex items-center justify-between"><div><p className="text-sm font-bold text-gray-800">Review & Approve Epics</p><p className="text-xs text-gray-400">Edit epics and tickets, approve what goes to Jira.</p></div><button onClick={()=>setStep("paste")} className="text-xs text-gray-400 hover:text-gray-600">← Back</button></div>
      {epics.map((epic,eIdx)=>{
        const epicReqs=selectedReqs.filter(r=>(epic.reqIds||[]).includes(String(r.id))||(epic.reqIds||[]).includes(r.id));
        return(
          <div key={eIdx} className={`bg-white rounded-2xl border-2 shadow-sm overflow-hidden transition-all ${epic.approved?"border-emerald-400":"border-gray-200"}`}>
            <div className={`px-4 py-3 flex items-center justify-between gap-3 ${epic.approved?"bg-emerald-50":"bg-gray-50"}`}>
              <div className="flex items-center gap-2 flex-wrap"><span className="text-xs font-black text-gray-400">EPIC {eIdx+1}</span>{epic.bucket&&<span className={`text-xs px-2 py-0.5 rounded-full font-medium ${buckBadge(epic.bucket)}`}>{epic.bucket}</span>}<span className="text-xs text-gray-400">{epicReqs.length} reqs · {epic.tickets?.length||0} tickets</span></div>
              <button onClick={()=>updateEpic(eIdx,{approved:!epic.approved})} className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border-2 transition-all ${epic.approved?"bg-emerald-500 border-emerald-500 text-white":"border-gray-300 text-gray-500 hover:border-emerald-400 hover:text-emerald-600"}`}>{epic.approved?"✓ Approved":"Approve"}</button>
            </div>
            <div className="p-4 space-y-3">
              <div><label className="text-xs font-bold text-gray-500 block mb-1">Title</label><input className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:border-indigo-400" value={epic.title} onChange={e=>updateEpic(eIdx,{title:e.target.value})}/></div>
              <div><label className="text-xs font-bold text-gray-500 block mb-1">Description</label><textarea className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none" rows={2} value={epic.description} onChange={e=>updateEpic(eIdx,{description:e.target.value})}/></div>
              {epicReqs.length>0&&<div className="space-y-1"><p className="text-xs font-bold text-gray-400">Linked requirements</p>{epicReqs.map(r=><div key={r.id} className="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-1.5"><span className="w-2 h-2 rounded-full bg-indigo-400 flex-shrink-0 mt-1"/>{r.problem}</div>)}</div>}
              {epic.tickets?.length>0&&(
                <div className="space-y-2 pt-1 border-t">
                  <p className="text-xs font-bold text-gray-400 pt-1">Child tickets</p>
                  {epic.tickets.map((t,tIdx)=>(
                    <div key={tIdx} className="bg-slate-50 border border-gray-200 rounded-xl p-3 space-y-2">
                      <div className="flex gap-2 items-center"><span className="text-xs font-black text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded flex-shrink-0">T{tIdx+1}</span><input className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400 bg-white" value={t.title} onChange={e=>updateTicket(eIdx,tIdx,{title:e.target.value})}/><button onClick={()=>removeTicket(eIdx,tIdx)} className="text-gray-300 hover:text-red-400 text-lg flex-shrink-0 leading-none">×</button></div>
                      {t.role&&t.goal&&<p className="text-xs text-gray-400 px-1">As a <strong>{t.role}</strong>, I want to {t.goal}</p>}
                      <div className="space-y-1">{(t.acs||[]).map((ac,ai)=><div key={ai} className="flex gap-2 items-start"><span className="text-xs text-gray-300 mt-1.5 flex-shrink-0">AC{ai+1}</span><input className="flex-1 border border-gray-100 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-indigo-300 bg-white" value={ac} onChange={e=>{const acs=[...t.acs];acs[ai]=e.target.value;updateTicket(eIdx,tIdx,{acs});}}/></div>)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })}
      <div className="sticky bottom-4 pt-2">
        <button onClick={pushToJira} disabled={!approvedEpics.length} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl">🚀 Push {approvedEpics.length} epic{approvedEpics.length!==1?"s":""} to Jira</button>
        {!approvedEpics.length&&<p className="text-center text-xs text-gray-400 mt-2">Approve at least one epic to continue</p>}
      </div>
    </div>
  );
  if(step==="paste")return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-4 flex items-center justify-between"><div><p className="text-sm font-bold text-gray-800">Step 2 — Paste Claude's response</p><p className="text-xs text-gray-400">Copy the JSON array Claude gave you and paste it below.</p></div><button onClick={()=>setStep("select")} className="text-xs text-gray-400 hover:text-gray-600">← Back</button></div>
      <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 space-y-2">
        <p className="text-xs font-bold text-indigo-700">In Claude.ai:</p>
        <ol className="text-xs text-indigo-600 space-y-1 list-decimal list-inside"><li>Paste the prompt (Ctrl+V / Cmd+V)</li><li>Wait for Claude to respond</li><li>Copy the entire JSON array</li><li>Come back here and paste it below</li></ol>
        <a href="https://claude.ai" target="_blank" className="inline-flex items-center gap-1.5 mt-2 px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700">Open Claude.ai ↗</a>
      </div>
      <div><label className="text-xs font-bold text-gray-500 block mb-2">Paste JSON here</label>
        <textarea className={`w-full border-2 rounded-xl px-4 py-3 text-xs font-mono focus:outline-none resize-none h-48 ${jsonError?"border-rose-400 bg-rose-50":"border-gray-200 focus:border-indigo-400"}`} placeholder={'[\n  {\n    "title": "...",\n    ...\n  }\n]'} value={jsonInput} onChange={e=>{setJsonInput(e.target.value);setJsonError("");}}/>
        {jsonError&&<p className="text-xs text-rose-600 mt-1">{jsonError}</p>}
      </div>
      <button onClick={parseJson} disabled={!jsonInput.trim()} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl">Parse & Review Epics →</button>
    </div>
  );
  return(
    <div className="space-y-4">
      <div className="bg-white rounded-xl border p-4 space-y-1"><p className="text-sm font-bold text-gray-800">Step 1 — Select Requirements</p><p className="text-xs text-gray-500">Pick requirements to turn into Jira epics. We'll build a prompt for Claude to group them.</p></div>
      {reqs.length===0?<div className="text-center py-16 text-gray-400"><p className="text-4xl mb-2">📭</p><p className="text-sm">No requirements yet.</p></div>:<>
        <div className="bg-white rounded-xl border p-3 flex items-center justify-between"><button onClick={toggleAll} className="text-xs font-bold text-indigo-600 hover:underline">{selectedIds.length===reqs.length?"Deselect all":"Select all"}</button><span className="text-xs text-gray-400">{selectedIds.length} of {reqs.length} selected</span></div>
        {Object.entries(byCluster).map(([cluster,clReqs])=>(
          <div key={cluster} className="bg-white rounded-xl border shadow-sm overflow-hidden">
            <div className="bg-slate-700 px-4 py-2.5 flex items-center justify-between"><span className="text-xs font-bold text-white">🗂️ {cluster}</span><span className="text-xs bg-white bg-opacity-20 text-white px-2 py-0.5 rounded-full">{clReqs.length}</span></div>
            <div className="divide-y">{clReqs.map(r=>{const tc=teamColor(r.team);const sel=selectedIds.includes(r.id);return(
              <div key={r.id} onClick={()=>toggleReq(r.id)} className={`flex items-start gap-3 px-4 py-3 cursor-pointer transition-all ${sel?"bg-indigo-50":"hover:bg-gray-50"}`}>
                <div className={`mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 transition-all ${sel?"bg-indigo-600 border-indigo-600":"border-gray-300"}`}>{sel&&<span className="text-white text-xs">✓</span>}</div>
                <div className="flex-1 min-w-0">
                  <p className={`text-sm font-semibold ${sel?"text-indigo-800":"text-gray-800"}`}>{r.problem}</p>
                  <div className="flex flex-wrap gap-1.5 mt-1"><Badge cls={tc.badge}>{r.team}</Badge>{r.issueType&&<Badge cls={typeBadge(r.issueType)}>{r.issueType}</Badge>}{r.frequency&&<Badge cls="bg-indigo-100 text-indigo-700">{r.frequency}</Badge>}</div>
                  {r.definition&&<p className="text-xs text-emerald-600 mt-1 italic">🎯 {r.definition?.slice(0,80)}{r.definition?.length>80?"…":""}</p>}
                </div>
              </div>
            );})}</div>
          </div>
        ))}
        <div className="sticky bottom-4 pt-2"><button onClick={copyAndOpen} disabled={!selectedIds.length} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover:bg-indigo-700 disabled:opacity-40 shadow-xl transition-all">{copied?"✅ Prompt copied! Claude.ai is opening…":"📋 Copy prompt & open Claude.ai"}</button></div>
      </>}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [day,setDay]=useState(1);
  const [tab,setTab]=useState(0);
  const [reqs,setReqs]=useState([]);
  const [votes,setVotes]=useState({});
  const [votingClosed,setVotingClosed]=useState(false);
  const [loading,setLoading]=useState(true);
  const [syncStatus,setSync]=useState("idle");
  const [lastRefresh,setRefresh]=useState(null);

  const loadAll=async()=>{
    const [reqRows,su]=await Promise.all([gsGet("requirements"),loadScoresUpvotes()]);
    setReqs(reqRows);
    setVotes(su.upvotes||{});
    setVotingClosed(su.votingClosed||false);
    setRefresh(new Date());
  };

  useEffect(()=>{loadAll().finally(()=>setLoading(false));},[]);
  useEffect(()=>{if(!user)return;const iv=setInterval(loadAll,30000);return()=>clearInterval(iv);},[user]);

  const withSync=async fn=>{setSync("syncing");try{await fn();setSync("ok");setTimeout(()=>setSync("idle"),2500);}catch{setSync("error");setTimeout(()=>setSync("idle"),4000);}};

  const addReq=async req=>{setSync("syncing");try{await gsUpsert("requirements",req);await loadAll();setSync("ok");setTimeout(()=>setSync("idle"),2500);}catch{setSync("error");setTimeout(()=>setSync("idle"),4000);}};

  const updateReq=async(id,patch)=>{
    const updated=reqs.map(r=>r.id===id?{...r,...patch}:r);setReqs(updated);
    const full=updated.find(r=>r.id===id);
    await withSync(()=>gsUpsert("requirements",full));
  };

  const deleteReq=async id=>{
    setReqs(p=>p.filter(r=>r.id!==id));
    await withSync(()=>gsDelete("requirements",id));
  };

  const castVote=async(reqId,pts)=>{
    const vid=user.team.toLowerCase().replace(/\s+/g,"-");
    const sid=String(reqId);
    setVotes(prev=>{
      const myVotes={...(prev[vid]||{})};
      if(pts===0){delete myVotes[sid];}else{myVotes[sid]=pts;}
      const next={...prev,[vid]:myVotes};
      gsUpsert("scores_upvotes",{id:vid,scores:{},upvotes:myVotes});
      return next;
    });
  };

  const closeVoting=async()=>{
    setVotingClosed(true);
    await gsUpsert("scores_upvotes",{id:"__voting_closed__",scores:true,upvotes:{}});
  };

  if(loading)return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#9ca3af",gap:"12px"}}><div style={{fontSize:"2.5rem"}}>⚡</div><p style={{fontSize:"0.875rem"}}>Loading from Google Sheets…</p></div>);
  if(!user)return <EntryScreen onEnter={(t,d)=>{setUser({team:t});setDay(d);setTab(0);}}/>;

  const tc=teamColor(user.team);
  const tabs=day===1?TABS_D1:TABS_D2;

  return(
    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50">
      <div className="bg-indigo-700 text-white px-6 py-4 flex items-center justify-between shadow-lg">
        <div><h1 className="text-xl font-bold">⚡ Offsite Hub</h1>
          <div className="flex items-center gap-2 mt-0.5"><span className={`text-xs px-2 py-0.5 rounded-full font-bold ${day===1?"bg-amber-400 text-amber-900":"bg-emerald-400 text-emerald-900"}`}>Day {day}</span><p className="text-indigo-300 text-xs">{day===1?"Roleplay + Capture":"Synthesis + Engineering"}</p></div>
        </div>
        <div className="text-right"><span className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${tc.bg} text-white`}>{user.team}</span><p className="text-indigo-300 text-xs mt-1 cursor-pointer hover:text-white" onClick={()=>setUser(null)}>Switch</p></div>
      </div>
      <div className="bg-white border-b px-6 py-2.5 flex gap-4 text-xs text-gray-500 flex-wrap items-center">
        <span>📌 <strong className="text-gray-800">{reqs.length}</strong> requirements</span>
        <span>🏷️ <strong className="text-gray-800">{[...new Set(reqs.map(r=>r.team))].length}</strong> teams</span>
        {votingClosed&&<span className="text-rose-600 font-bold">🏁 Voting closed</span>}
        <span className="flex items-center gap-1.5"><SyncBadge status={syncStatus}/>{syncStatus==="idle"&&lastRefresh&&<span className="text-gray-300">Synced {lastRefresh.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>}</span>
        <button onClick={()=>setDay(d=>d===1?2:1)} className="ml-auto text-indigo-500 hover:underline">Switch to Day {day===1?2:1} →</button>
      </div>
      <div className="flex border-b bg-white px-4 overflow-x-auto">
        {tabs.map((t,i)=><button key={i} onClick={()=>setTab(i)} className={`px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${tab===i?"border-indigo-600 text-indigo-700":"border-transparent text-gray-500 hover:text-gray-700"}`}>{t}</button>)}
      </div>
      <div className="max-w-3xl mx-auto p-5">
        {day===1&&tab===0&&<SubmitTab user={user} onSave={addReq} syncStatus={syncStatus}/>}
        {day===1&&tab===1&&<RequirementsTab reqs={reqs} user={user} onUpdate={updateReq} onDelete={deleteReq}/>}
        {day===2&&tab===0&&<ReadOutTab reqs={reqs}/>}
        {day===2&&tab===1&&<SynthesisTab reqs={reqs} onUpdateReq={updateReq}/>}
        {day===2&&tab===2&&<VotingTab reqs={reqs} votes={votes} votingClosed={votingClosed} user={user} onVote={castVote} onCloseVoting={closeVoting}/>}
        {day===2&&tab===3&&<EngineeringTab reqs={reqs}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
